<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isekaz Collection</title>
<meta name="description" content="Isekaz Collection — le catalogue des collectionneurs de manga : séries, tomes, ISBN, doubles et liste de souhaits.">
<meta name="theme-color" content="#0a0607">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Isekaz">
<meta property="og:image" content="assets/isekaz-512.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0607; --panel: #140e10; --panel-2: #1d1417; --line: #2e1f23; --text: #f4eeee; --muted: #a8999c;
    --red: #e0283c; --red-deep: #8f1322; --sakura: #f6a9bd; --gold: #c9a45c; --white: #fbf7f6;
    --glow: 0 0 0 1px rgba(224,40,60,.55), 0 10px 30px -10px rgba(224,40,60,.55);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; min-height: 100vh; color: var(--text); font-family: Inter, system-ui, sans-serif;
         background: radial-gradient(900px 600px at 85% -10%, rgba(224,40,60,.22), transparent 60%),
                     radial-gradient(700px 500px at -10% 110%, rgba(246,169,189,.08), transparent 60%), var(--bg);
         background-attachment: fixed; }
  button, select { font: inherit; cursor: pointer; }
  #sakura { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  header, main, footer { position: relative; z-index: 1; }

  /* ---------- En-tête ---------- */
  header { position: sticky; top: 0; z-index: 10; background: rgba(10,6,7,.86); backdrop-filter: blur(10px);
           border-bottom: 1px solid var(--line); padding: 10px clamp(16px, 4vw, 40px); }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
                  background: linear-gradient(90deg, transparent, var(--red), transparent); opacity: .7; }
  .top { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; min-width: 0; }
  .brand img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--red); flex: none; }
  .brand h1 { font-family: "Bebas Neue", sans-serif; font-size: 28px; letter-spacing: 1.5px; margin: 0; white-space: nowrap;
              transform: skewX(-6deg); }
  .brand h1 span { color: var(--red); }
  .account { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .pseudo { font-weight: 600; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .level { background: linear-gradient(90deg, var(--red-deep), var(--red)); color: var(--white); font-weight: 700;
           border-radius: 999px; padding: 3px 10px; font-size: 12px; white-space: nowrap; letter-spacing: .3px; }
  .lang { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 6px; font-size: 13px; }
  .btn { background: var(--red); color: var(--white); border: none; border-radius: 10px; padding: 9px 16px; font-weight: 700;
         letter-spacing: .3px; transition: background .15s, transform .15s; }
  .btn:hover { background: #f03a4e; }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
  .btn.ghost:hover { color: var(--text); border-color: var(--red); }
  .bar2 { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .search { flex: 1 1 280px; display: flex; gap: 8px; }
  input[type=search], dialog input { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 10px;
          padding: 10px 14px; font: inherit; width: 100%; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--sakura); outline-offset: 2px; }
  nav { display: flex; gap: 4px; }
  nav button { background: none; border: 1px solid transparent; color: var(--muted); border-radius: 999px; padding: 7px 13px; }
  nav button.on { color: var(--white); border-color: var(--red); background: rgba(224,40,60,.12); }

  main { padding: 22px clamp(16px, 4vw, 40px) 70px; max-width: 1200px; margin: 0 auto; }

  /* ---------- Bannière ---------- */
  .hero { display: grid; grid-template-columns: minmax(0, 300px) 1fr; gap: clamp(18px, 4vw, 44px); align-items: center;
          margin: 6px 0 28px; }
  .hero-art { position: relative; aspect-ratio: 1; border-radius: 20px; overflow: hidden; box-shadow: 0 25px 60px -20px rgba(224,40,60,.6);
              animation: float 7s ease-in-out infinite; }
  .hero-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-art::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
                     background: linear-gradient(180deg, transparent 60%, rgba(10,6,7,.35)); }
  .kanji { font-family: "Noto Serif JP", serif; color: var(--red); letter-spacing: 6px; font-size: 14px; margin-bottom: 6px; }
  .hero h2 { font-family: "Bebas Neue", sans-serif; font-size: clamp(42px, 7vw, 76px); line-height: .92; margin: 0;
             letter-spacing: 1px; transform: skewX(-6deg); text-shadow: 0 0 30px rgba(224,40,60,.35); }
  .hero h2 span { color: var(--red); }
  .hero p { color: var(--muted); max-width: 520px; line-height: 1.55; margin: 14px 0 0; }
  .hero-stats { display: flex; gap: 22px; margin-top: 18px; flex-wrap: wrap; }
  .hero-stats div { font-size: 13px; color: var(--muted); }
  .hero-stats b { display: block; font-family: "Bebas Neue", sans-serif; font-size: 30px; color: var(--white); letter-spacing: .5px; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-.4deg); } 50% { transform: translateY(-8px) rotate(.4deg); } }

  /* ---------- Filtres de langue ---------- */
  .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .filters .label { color: var(--muted); font-size: 13px; margin-right: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
          border-radius: 999px; padding: 5px 11px; font-size: 13px; user-select: none; }
  .chip input { accent-color: var(--red); margin: 0; }
  .chip.on { color: var(--white); border-color: var(--red); background: rgba(224,40,60,.12); }
  .chip small { opacity: .7; }

  .notice { color: var(--sakura); font-size: 14px; margin: 0 0 14px; min-height: 1em; }
  .section-title { display: flex; align-items: center; gap: 10px; font-family: "Bebas Neue", sans-serif; font-size: 26px;
                   letter-spacing: 1px; margin: 0 0 14px; }
  .section-title svg { color: var(--red); flex: none; }

  /* ---------- Cartes série ---------- */
  .series { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .card { position: relative; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line);
          border-radius: 14px; padding: 18px 18px 16px; cursor: pointer; overflow: hidden; transition: transform .18s, box-shadow .18s, border-color .18s; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(var(--red), var(--red-deep)); }
  .card:hover { transform: translateY(-3px); box-shadow: var(--glow); border-color: transparent; }
  .card h2 { font-family: "Bebas Neue", sans-serif; font-size: 27px; margin: 0 0 4px; letter-spacing: .6px; }
  .meta { color: var(--muted); font-size: 14px; }
  .flag { position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 700; letter-spacing: .5px; color: var(--sakura);
          border: 1px solid rgba(246,169,189,.4); border-radius: 6px; padding: 2px 6px; }
  .progress { height: 5px; background: var(--line); border-radius: 3px; margin-top: 14px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--red-deep), var(--red), var(--sakura)); }

  /* ---------- Page série ---------- */
  .back { background: none; border: none; color: var(--sakura); padding: 0; margin-bottom: 14px; }
  .title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .title-row h2 { font-family: "Bebas Neue", sans-serif; font-size: clamp(36px, 6vw, 48px); margin: 0; letter-spacing: 1px; transform: skewX(-5deg); }
  .vols { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 20px; }
  .vol { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
         transition: border-color .15s, box-shadow .15s; }
  .vol.owned { border-color: var(--red); box-shadow: 0 8px 24px -12px rgba(224,40,60,.7); }
  .vol.wished { border-color: var(--sakura); }
  .vol.missing { opacity: .4; border-style: dashed; }
  .cover { aspect-ratio: 2/3; background: repeating-linear-gradient(135deg, #1a1215 0 10px, #170f12 10px 20px); display: grid; place-items: center;
           position: relative; font-family: "Bebas Neue", sans-serif; font-size: 46px; color: #4a3337; }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .badge { position: absolute; top: 8px; right: 8px; background: var(--red); color: var(--white); font: 700 12px Inter, sans-serif;
           border-radius: 999px; padding: 3px 8px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .badge.dbl { background: var(--gold); color: #2a1d05; }
  .info { padding: 8px 10px; font-size: 13px; }
  .isbn { font-family: ui-monospace, monospace; color: var(--muted); font-size: 11px; }
  .actions { display: flex; gap: 6px; padding: 0 10px 10px; margin-top: auto; align-items: center; }
  .actions button { flex: 1; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); padding: 6px 0; font-size: 13px; }
  .actions button:hover { border-color: var(--red); }
  .actions button.on-wish { background: var(--sakura); color: #3a0e1a; border-color: var(--sakura); }
  .qty { display: flex; align-items: center; gap: 4px; flex: 1.4; }
  .qty button { flex: 0 0 28px; }
  .qty span { flex: 1; text-align: center; font-weight: 700; color: var(--white); }

  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; min-width: 130px; color: var(--muted); font-size: 13px; }
  .stat b { display: block; font-family: "Bebas Neue", sans-serif; font-size: 34px; color: var(--white); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; line-height: 1.6; }
  footer { text-align: center; color: #5d4a4e; font-size: 12px; padding: 0 0 30px; }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: min(380px, 92vw);
           box-shadow: var(--glow); }
  dialog::backdrop { background: rgba(0,0,0,.7); backdrop-filter: blur(2px); }
  dialog form { display: grid; gap: 10px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button { flex: 1; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .tabs button.on { color: var(--white); border-color: var(--red); }
  .err { color: #ff8a96; font-size: 13px; min-height: 1em; margin: 0; }

  /* ---------- Hors ligne / installation ---------- */
  .offline { position: relative; z-index: 9; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
             background: linear-gradient(90deg, #3a0d15, #5a1420, #3a0d15); color: var(--white); font-size: 13px; padding: 8px 14px; text-align: center; }
  .offline[hidden] { display: none; }
  .offline .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sakura); box-shadow: 0 0 8px var(--sakura); }
  .sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .install { display: none; }
  .install.show { display: inline-block; }
  .tip { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; color: var(--muted); font-size: 14px; line-height: 1.5; }

  /* ---------- Scanner et fiche produit ---------- */
  .fab { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 20; width: 62px; height: 62px; border-radius: 50%;
         border: none; background: radial-gradient(circle at 30% 30%, #f03a4e, var(--red-deep)); color: var(--white); display: grid; place-items: center;
         box-shadow: 0 10px 28px -6px rgba(224,40,60,.8), 0 0 0 4px rgba(10,6,7,.6); }
  .fab:active { transform: scale(.96); }
  dialog.sheet { width: min(460px, 94vw); padding: 0; overflow: hidden; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sheet-head h3 { margin: 0; font-family: "Bebas Neue", sans-serif; font-size: 24px; letter-spacing: 1px; }
  .x { background: none; border: none; color: var(--muted); font-size: 22px; line-height: 1; padding: 4px 8px; }
  .sheet-body { padding: 16px; max-height: 78vh; overflow: auto; }
  .cam { position: relative; aspect-ratio: 4/3; background: #000; border-radius: 12px; overflow: hidden; }
  .cam video { width: 100%; height: 100%; object-fit: cover; }
  .cam .frame { position: absolute; left: 10%; right: 10%; top: 32%; bottom: 32%; border: 2px solid var(--sakura); border-radius: 10px;
                box-shadow: 0 0 0 999px rgba(0,0,0,.45); }
  .cam .laser { position: absolute; left: 12%; right: 12%; top: 50%; height: 2px; background: var(--red); box-shadow: 0 0 12px var(--red);
                animation: laser 1.6s ease-in-out infinite; }
  @keyframes laser { 0%, 100% { transform: translateY(-28px); } 50% { transform: translateY(28px); } }
  .scan-status { color: var(--muted); font-size: 13px; margin: 10px 0; min-height: 1.2em; text-align: center; }
  .manual { display: flex; gap: 8px; }
  .manual input { flex: 1; font-family: ui-monospace, monospace; }
  .prod { display: grid; grid-template-columns: 110px 1fr; gap: 14px; }
  .prod .cover { border-radius: 8px; font-size: 32px; }
  .prod h4 { margin: 0 0 4px; font-size: 18px; line-height: 1.25; }
  .prod dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 8px 0 0; font-size: 13px; }
  .prod dt { color: var(--muted); } .prod dd { margin: 0; }
  .soon { display: inline-block; margin-left: 6px; background: rgba(246,169,189,.15); color: var(--sakura); border-radius: 6px; padding: 1px 6px; font-size: 12px; font-weight: 600; }
  .desc { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 14px 0 0; white-space: pre-line; }
  .desc.short { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .link { background: none; border: none; color: var(--sakura); padding: 0; font-size: 13px; }
  .prod-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .prod-actions .btn { flex: 1; }
  .prod-actions .qty { flex: 1.3; background: var(--panel-2); border: 1px solid var(--red); border-radius: 10px; padding: 4px; }
  .prod-actions .qty button { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 8px; height: 34px; }
  .pending-scans { margin-bottom: 18px; }
  .pending-scans li { font-family: ui-monospace, monospace; font-size: 13px; color: var(--muted); }

  @media (max-width: 640px) {
    .brand h1 { font-size: 24px; } .brand h1 span { display: none; } .brand img { width: 34px; height: 34px; }
    .top.logged .brand h1 { display: none; }
    .account { gap: 6px; } .lang { padding: 5px 2px; font-size: 12px; }
    .account .pseudo { max-width: 80px; } .account .btn.ghost { padding: 7px 9px; }
    .hero { grid-template-columns: 110px 1fr; gap: 14px; align-items: start; }
    .hero-art { border-radius: 14px; }
    .hero p { display: none; }
    .hero-stats { gap: 14px; margin-top: 8px; } .hero-stats b { font-size: 24px; }
    nav { width: 100%; justify-content: space-between; } nav button { flex: 1; padding: 7px 4px; font-size: 13px; white-space: nowrap; }
  }
  @media (prefers-reduced-motion: reduce) { .hero-art { animation: none; } .card, .card:hover { transition: none; transform: none; } }
</style>
</head>
<body>
<canvas id="sakura" aria-hidden="true"></canvas>
<header>
  <div class="top">
    <div class="brand" id="home"><img src="assets/favicon.png" alt=""><h1>Isekaz <span>Collection</span></h1></div>
    <div class="account">
      <select class="lang" id="siteLang" aria-label="Langue du site">
        <option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option>
      </select>
      <span id="account"></span>
    </div>
  </div>
  <div class="bar2">
    <form class="search" id="searchForm">
      <input id="q" type="search" autocomplete="off" data-i18n-placeholder="searchPh">
      <button class="btn" type="submit" data-i18n="search"></button>
    </form>
    <button class="btn ghost install" id="installBtn" type="button">📲 <span data-i18n="install"></span></button>
    <nav id="nav">
      <button data-view="catalogue" class="on" data-i18n="catalogue"></button>
      <button data-view="collection" data-i18n="myCollection"></button>
      <button data-view="souhaits" data-i18n="wishlist"></button>
    </nav>
  </div>
</header>
<div class="offline" id="offline" hidden><span class="dot"></span><span id="offlineText"></span></div>
<main>
  <p class="notice" id="notice" role="status"></p>
  <div id="app"></div>
</main>
<footer>Isekaz Collection · <span data-i18n="footer"></span></footer>

<button class="fab" id="scanBtn" type="button" data-i18n-aria="scan" title="">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg>
</button>

<dialog id="scanner" class="sheet">
  <div class="sheet-head"><h3 data-i18n="scan"></h3><button class="x" id="scanClose" aria-label="×">×</button></div>
  <div class="sheet-body">
    <div class="cam"><video id="video" playsinline muted></video><div class="frame"></div><div class="laser"></div></div>
    <p class="scan-status" id="scanStatus"></p>
    <form class="manual" id="manualForm"><input id="manualIsbn" inputmode="numeric" maxlength="17" data-i18n-placeholder="isbnPh">
      <button class="btn" type="submit">OK</button></form>
  </div>
</dialog>

<dialog id="fiche" class="sheet">
  <div class="sheet-head"><h3 data-i18n="product"></h3><button class="x" id="ficheClose" aria-label="×">×</button></div>
  <div class="sheet-body" id="ficheBody"></div>
</dialog>

<dialog id="auth">
  <div class="tabs"><button data-mode="login" class="on" data-i18n="login"></button><button data-mode="signup" data-i18n="signup"></button></div>
  <form id="authForm" method="dialog">
    <input id="aPseudo" minlength="3" maxlength="24" hidden data-i18n-placeholder="pseudoPh">
    <input id="aEmail" type="email" required autocomplete="email" data-i18n-placeholder="emailPh">
    <input id="aPass" type="password" minlength="6" required autocomplete="current-password" data-i18n-placeholder="passPh">
    <p class="err" id="aErr"></p>
    <button class="btn" type="submit" id="aSubmit"></button>
    <button class="btn ghost" type="button" id="aClose" data-i18n="cancel"></button>
  </form>
</dialog>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  // Clé publique (lecture seule grâce aux règles RLS) — la clé secrète ne va JAMAIS ici.
  const URL_SB = "https://rohiqowmjtcrrailkgdb.supabase.co";
  const db = createClient(URL_SB, "sb_publishable_626JHq5Ylaj9hbhs9mZKrA_ildFkUoA");

  // ---------- Traductions ----------
  const I18N = {
    fr: {
      searchPh: "Une série ou un ISBN (même s'il n'est pas encore sur le site)", search: "Chercher",
      catalogue: "Catalogue", myCollection: "Ma collection", wishlist: "Souhaits", login: "Connexion", signup: "Créer un compte",
      logout: "Déconnexion", cancel: "Annuler", pseudoPh: "Pseudo (3 à 24 caractères)", emailPh: "E-mail",
      passPh: "Mot de passe (6 caractères min.)", doLogin: "Se connecter", doSignup: "Créer mon compte",
      footer: "le catalogue des collectionneurs de manga",
      heroTag: "Le sanctuaire des collectionneurs", heroText: "Retrouve chaque série, chaque tome et son ISBN. Coche ce que tu possèdes, compte tes doubles, prépare ta liste de souhaits — et monte en niveau.",
      statSeries: "séries", statVols: "tomes", statLevel: "ton niveau",
      editionLang: "Langue de l'édition :", allSeries: "Toutes les séries", results: "Résultats",
      volsRef: n => `${n} tome(s) référencé(s)`, tome: "Tome", missingIsbn: "ISBN manquant",
      own: "✓ Je l'ai", removeOne: "Retirer un exemplaire", addOne: "Ajouter un exemplaire (double)", wishT: "Liste de souhaits",

      scansFailed: n => `${n} ISBN(s) scanned offline couldn't be found.`,
    },
  };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* stockage indisponible */ } },
  };
  let lang = store.get("isekaz.lang", (navigator.language || "fr").slice(0, 2) === "fr" ? "fr" : "en");
  if (!I18N[lang]) lang = "fr";
  const t = (k, ...a) => { const v = I18N[lang][k] ?? I18N.fr[k]; return typeof v === "function" ? v(...a) : v; };

  function applyI18n() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
    document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); el.title = t(el.dataset.i18nAria); });
    $("siteLang").value = lang;
  }

  const $ = id => document.getElementById(id);
  const app = $("app"), notice = $("notice"), q = $("q");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const state = { user: null, profile: null, series: [], coll: new Map(), view: "catalogue", serie: null, filterIds: null, limit: 60,
                  editionLangs: new Set(store.get("isekaz.editionLangs", [lang])) };
  const TORII = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 4.5c3 .8 6.5 1.1 10 1.1s7-.3 10-1.1V7c-.9.2-1.8.4-2.8.5V9H21v2h-1.8v9h-2.2v-9H7v9H4.8v-9H3V9h1.8V7.5C3.8 7.4 2.9 7.2 2 7V4.5zM7 7.8V9h4V8c-1.4 0-2.7-.1-4-.2zm6 .2v1h4V7.8c-1.3.1-2.6.2-4 .2z"/></svg>`;

  // ---------- Copie locale (hors ligne) ----------
  // Tout ce qui est lu en ligne est aussi rangé ici, pour pouvoir le relire sans réseau.
  const local = (() => {
    let dbp;
    const open = () => dbp ??= new Promise((ok, ko) => {
      const r = indexedDB.open("isekaz", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
    });
    const run = (mode, fn) => open().then(d => new Promise((ok, ko) => {
      const tx = d.transaction("kv", mode); const req = fn(tx.objectStore("kv"));
      tx.oncomplete = () => ok(req?.result); tx.onerror = () => ko(tx.error);
    })).catch(() => undefined);
    return { get: k => run("readonly", s => s.get(k)), set: (k, v) => run("readwrite", s => s.put(v, k)), del: k => run("readwrite", s => s.delete(k)) };
  })();
  const isOffline = () => !navigator.onLine;
  const netError = e => e && (isOffline() || /fetch|network|load failed/i.test(e.message ?? String(e)));

  async function rememberVols(sid, vols) {
    await local.set(`vols:${sid}`, vols);
    const idx = (await local.get("isbnIndex")) ?? {};
    (vols ?? []).forEach(v => { if (v.isbn13) idx[v.isbn13] = +sid; });
    await local.set("isbnIndex", idx);
  }

  // Modifications faites sans réseau : gardées (une par tome) puis envoyées au retour du réseau.
  async function queueGet() { return state.user ? (await local.get(`queue:${state.user.id}`)) ?? {} : {}; }
  async function queueSet(qu) { if (state.user) await local.set(`queue:${state.user.id}`, qu); }
  async function saveColl() { if (state.user) await local.set(`coll:${state.user.id}`, [...state.coll.values()]); }

  async function flushQueue() {
    if (!state.user || isOffline()) return;
    const qu = await queueGet(), ops = Object.values(qu);
    if (!ops.length) return updateOffline();
    let sent = 0;
    for (const o of ops) {
      const { error } = (o.quantite === 0 && !o.souhait)
        ? await db.from("collection").delete().eq("volume_id", o.volume_id).eq("user_id", state.user.id)
        : await db.from("collection").upsert({ user_id: state.user.id, volume_id: o.volume_id, quantite: o.quantite,
            souhait: o.souhait, updated_at: o.at }, { onConflict: "user_id,volume_id" });
      if (error) { if (netError(error)) break; } // coupure : on réessaiera plus tard
      delete qu[o.volume_id]; sent++;
    }
    await queueSet(qu);
    if (sent) say(t("synced", sent));
    updateOffline();
  }

  async function updateOffline() {
    const n = Object.keys(await queueGet()).length + ((await local.get("scans")) ?? []).length;
    $("offline").hidden = !isOffline() && !n;
    $("offlineText").textContent = isOffline() ? t("offline") + (n ? " " + t("pending", n) : "") : t("pending", n);
  }

  // Avec du réseau : on enregistre toutes les séries de la collection (et leurs couvertures) pour le hors ligne.
  // Copie de TOUT le catalogue (sans les descriptions, pour rester léger) : la fiche d'un tome
  // s'ouvre même sans réseau, qu'on l'ait ou non. Complète une fois par jour, sinon seulement les nouveautés.
  let syncing = false;
  async function syncCatalogue() {
    if (isOffline() || syncing) return;
    syncing = true;
    try {
      const full = Date.now() - store.get("isekaz.catSync", 0) > 7 * 864e5; // complète une fois par semaine
      const maxId = full ? 0 : store.get("isekaz.catMaxId", 0);
      const cols = "id,serie_id,numero,isbn13,date_parution,prix,devise,couverture_url,titre";
      const rows = [];
      for (let from = 0; ; from += 1000) {
        const { data, error } = await db.from("volumes").select(cols).gt("id", maxId).order("id").range(from, from + 999);
        if (error) return;
        rows.push(...data);
        if (data.length < 1000) break;
      }
      const par = {};
      rows.forEach(v => (par[v.serie_id] ??= []).push(v));
      const idx = full ? {} : (await local.get("isbnIndex")) ?? {};
      for (const [sid, vs] of Object.entries(par)) {
        const avant = new Map(((await local.get(`vols:${sid}`)) ?? []).map(v => [v.id, v]));
        // on garde les infos déjà complètes (description…) et on ajoute/actualise le reste
        vs.forEach(v => avant.set(v.id, { ...(avant.get(v.id) ?? {}), ...v }));
        const liste = [...avant.values()].filter(v => !full || vs.some(x => x.id === v.id)).sort((a, b) => a.numero - b.numero);
        await local.set(`vols:${sid}`, liste);
        liste.forEach(v => { if (v.isbn13) idx[v.isbn13] = +sid; });
      }
      await local.set("isbnIndex", idx);
      if (rows.length) store.set("isekaz.catMaxId", Math.max(maxId, ...rows.map(v => v.id)));
      if (full) store.set("isekaz.catSync", Date.now());
    } finally { syncing = false; }
  }

  async function prefetchForOffline() {
    if (!state.user || isOffline()) return;
    const ids = [...state.coll.keys()];
    if (!ids.length) return;
    const { data: mine, error } = await db.from("volumes").select("serie_id").in("id", ids);
    if (error) return;
    const serieIds = [...new Set(mine.map(v => v.serie_id))];
    const { data: vols } = await db.from("volumes").select("*").in("serie_id", serieIds).order("numero");
    const par = {};
    (vols ?? []).forEach(v => (par[v.serie_id] ??= []).push(v));
    for (const [sid, vs] of Object.entries(par)) await rememberVols(sid, vs);
    // les couvertures passent par le service worker, qui les garde
    const covers = (vols ?? []).map(v => v.couverture_url || `https://covers.openlibrary.org/b/isbn/${v.isbn13}-M.jpg?default=false`);
    for (const u of covers.slice(0, 400)) { try { await fetch(u, { mode: "no-cors" }); } catch { /* tant pis */ } }
    if (!store.get("isekaz.offlineReadyShown", false)) { store.set("isekaz.offlineReadyShown", true); say(t("offlineReady")); }
  }

  // ---------- Compte ----------
  async function loadUser() {
    const { data: { session } } = await db.auth.getSession();
    state.user = session?.user ?? null;
    if (!state.user && isOffline()) state.user = (await local.get("lastUser")) ?? null; // jeton expiré sans réseau
    state.profile = null; state.coll = new Map();
    if (state.user) {
      await local.set("lastUser", { id: state.user.id });
      const [{ data: p, error: e1 }, { data: c, error: e2 }] = await Promise.all([
        db.from("profiles").select("pseudo").eq("id", state.user.id).maybeSingle(),
        db.from("collection").select("volume_id, quantite, souhait"),
      ]);
      state.profile = e1 ? await local.get(`profile:${state.user.id}`) : p;
      if (!e1 && p) await local.set(`profile:${state.user.id}`, p);
      const rows = e2 ? (await local.get(`coll:${state.user.id}`)) ?? [] : c ?? [];
      rows.forEach(r => state.coll.set(r.volume_id, r));
      // les changements pas encore envoyés passent devant ce que dit le serveur
      Object.values(await queueGet()).forEach(o => (o.quantite === 0 && !o.souhait) ? state.coll.delete(o.volume_id) : state.coll.set(o.volume_id, o));
      await saveColl();
    } else {
      await local.del("lastUser");
    }
    renderAccount();
    updateOffline();
  }

  function stats() {
    let possedes = 0, doubles = 0, souhaits = 0;
    for (const r of state.coll.values()) {
      if (r.quantite > 0) possedes++;
      doubles += Math.max(r.quantite - 1, 0);
      if (r.souhait) souhaits++;
    }
    return { possedes, doubles, souhaits, niveau: 1 + Math.floor(possedes / 10), prochain: 10 - (possedes % 10) };
  }

  function renderAccount() {
    const el = $("account");
    document.querySelector(".top").classList.toggle("logged", !!state.user);
    if (!state.user) { el.innerHTML = `<button class="btn" id="loginBtn">${t("login")}</button>`; $("loginBtn").onclick = () => openAuth("login"); return; }
    const s = stats();
    el.innerHTML = `<span style="display:inline-flex;gap:8px;align-items:center">
      <span class="level" title="${esc(t("levelTitle", s.prochain))}">${t("lvl")} ${s.niveau}</span>
      <span class="pseudo">${esc(state.profile?.pseudo ?? "…")}</span>
      <button class="btn ghost" id="logoutBtn">${t("logout")}</button></span>`;
    $("logoutBtn").onclick = async () => { await db.auth.signOut(); };
  }

  let mode = "login";
  function openAuth(m) {
    mode = m;
    document.querySelectorAll("#auth .tabs button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
    $("aPseudo").hidden = m !== "signup"; $("aPseudo").required = m === "signup";
    $("aSubmit").textContent = m === "signup" ? t("doSignup") : t("doLogin");
    $("aPass").autocomplete = m === "signup" ? "new-password" : "current-password";
    $("aErr").textContent = "";
    if (!$("auth").open) $("auth").showModal();
  }
  document.querySelectorAll("#auth .tabs button").forEach(b => b.onclick = () => openAuth(b.dataset.mode));
  $("aClose").onclick = () => $("auth").close();
  $("authForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("aErr").textContent = "";
    const email = $("aEmail").value.trim(), password = $("aPass").value;
    if (mode === "signup") {
      const pseudo = $("aPseudo").value.trim();
      const { data: pris } = await db.from("profiles").select("id").ilike("pseudo", pseudo).maybeSingle();
      if (pris) { $("aErr").textContent = t("pseudoTaken"); return; }
      const { data, error } = await db.auth.signUp({ email, password, options: { data: { pseudo }, emailRedirectTo: location.origin + location.pathname } });
      if (error) { $("aErr").textContent = error.message; return; }
      $("auth").close();
      if (!data.session) say(t("checkMail"));
    } else {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) { $("aErr").textContent = t("badLogin"); return; }
      $("auth").close();
    }
  });
  db.auth.onAuthStateChange(() => { loadUser().then(render); });

  // ---------- Collection ----------
  async function setEntry(volumeId, patch) {
    if (!state.user) { openAuth("login"); say(t("loginFirst")); return; }
    const cur = state.coll.get(volumeId) ?? { volume_id: volumeId, quantite: 0, souhait: false };
    const next = { ...cur, ...patch };
    next.quantite = Math.max(0, Math.min(99, next.quantite));
    if (next.quantite > 0) next.souhait = false; // on l'a : il sort de la liste de souhaits
    const at = new Date().toISOString();
    let error = null;
    if (!isOffline() && !Object.keys(await queueGet()).length) {
      ({ error } = (next.quantite === 0 && !next.souhait)
        ? await db.from("collection").delete().eq("volume_id", volumeId).eq("user_id", state.user.id)
        : await db.from("collection").upsert({ user_id: state.user.id, volume_id: volumeId, quantite: next.quantite,
            souhait: next.souhait, updated_at: at }, { onConflict: "user_id,volume_id" }));
      if (error && !netError(error)) { say(t("error") + error.message); return; }
    }
    if (isOffline() || error || Object.keys(await queueGet()).length) {
      const qu = await queueGet();
      qu[volumeId] = { volume_id: volumeId, quantite: next.quantite, souhait: next.souhait, at };
      await queueSet(qu);
    }
    if (next.quantite === 0 && !next.souhait) state.coll.delete(volumeId); else state.coll.set(volumeId, next);
    await saveColl();
    renderAccount(); render(); updateOffline();
    if (!isOffline()) flushQueue();
  }

  // ---------- Données ----------
  async function loadSeries() {
    // le serveur renvoie 1000 lignes maximum par demande : on lit le catalogue par paquets
    let data = [], error = null;
    for (let from = 0; ; from += 1000) {
      const r = await db.from("series").select("*, volumes(count)").order("titre").order("id").range(from, from + 999);
      if (r.error) { error = r.error; break; }
      data.push(...r.data);
      if (r.data.length < 1000) break;
    }
    if (!error) { state.series = data; await local.set("series", data); return; }
    state.series = (await local.get("series")) ?? [];
    if (!netError(error)) say(t("error") + error.message);
  }

  async function searchOnline(text) {
    const digits = text.replace(/[^0-9]/g, "");
    const body = digits.length === 13 ? { isbn: digits } : { q: text };
    if (isOffline()) { say(t("offlineSearch")); return; }
    if (body.isbn) say(t("searchingIsbn")); else if (!notice.textContent) say(t("searching", text));
    try {
      const r = await fetch(`${URL_SB}/functions/v1/recherche`, { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

  // ---------- Pétales de cerisier ----------
  (function sakura() {
    const cv = $("sakura"), ctx = cv.getContext("2d");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let w, h, petals = [], raf;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    function resize() {
      w = innerWidth; h = innerHeight;
      cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = reduce ? 0 : Math.round(Math.min(34, Math.max(12, w / 40)));
      while (petals.length < n) petals.push(newPetal(true));
      petals.length = n;
    }
    function newPetal(anywhere) {
      return { x: Math.random() * w, y: anywhere ? Math.random() * h : -20, s: 5 + Math.random() * 7,
               vy: .35 + Math.random() * .8, vx: .2 + Math.random() * .6, a: Math.random() * Math.PI * 2,
               va: (Math.random() - .5) * .03, sway: Math.random() * Math.PI * 2, o: .45 + Math.random() * .45,
               hue: Math.random() < .2 ? "#ffffff" : Math.random() < .5 ? "#f6a9bd" : "#f2869f" };
    }
    function draw(p) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.scale(1, .55 + .45 * Math.abs(Math.sin(p.sway)));
      ctx.globalAlpha = p.o; ctx.fillStyle = p.hue;
      ctx.beginPath(); ctx.moveTo(0, -p.s);
      ctx.bezierCurveTo(p.s * .9, -p.s * .6, p.s * .7, p.s * .6, 0, p.s);
      ctx.bezierCurveTo(-p.s * .7, p.s * .6, -p.s * .9, -p.s * .6, 0, -p.s);
      ctx.fill();
      ctx.globalAlpha = p.o * .5; ctx.fillStyle = "#e0283c";
      ctx.beginPath(); ctx.arc(0, -p.s * .78, p.s * .14, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    function tick() {
      ctx.clearRect(0, 0, w, h);
      for (const p of petals) {
        p.sway += .02; p.y += p.vy; p.x += p.vx + Math.sin(p.sway) * .6; p.a += p.va;
        if (p.y > h + 20 || p.x > w + 20) Object.assign(p, newPetal(false), { x: Math.random() * w * 1.1 - w * .1 });
        draw(p);
      }
      raf = requestAnimationFrame(tick);
    }
    addEventListener("resize", resize);
    document.addEventListener("visibilitychange", () => { cancelAnimationFrame(raf); if (!document.hidden && petals.length) tick(); });
    resize(); if (petals.length) tick();
  })();

  // ---------- Scanner de code-barres ----------
  // EAN-13 d'un livre : commence par 978 ou 979, avec la bonne clé de contrôle.
  function isbnValide(code) {
    const d = String(code).replace(/[^0-9]/g, "");
    if (!/^97[89]\d{10}$/.test(d)) return null;
    const sum = [...d.slice(0, 12)].reduce((a, c, i) => a + +c * (i % 2 ? 3 : 1), 0);
    return (10 - sum % 10) % 10 === +d[12] ? d : null;
  }
  const ZXING = "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";
  const scan = { stream: null, timer: null, controls: null, busy: false };

  async function openScanner() {
    $("scanStatus").textContent = t("aim"); $("manualIsbn").value = "";
    $("scanner").showModal();
    scan.busy = false;
    try {
      const video = $("video");
      if ("BarcodeDetector" in window && (await BarcodeDetector.getSupportedFormats()).includes("ean_13")) {
        scan.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } }, audio: false });
        video.srcObject = scan.stream; await video.play();
        const det = new BarcodeDetector({ formats: ["ean_13"] });
        const loop = async () => {
          if (!scan.stream) return;
          try { for (const c of await det.detect(video)) if (await found(c.rawValue)) return; } catch { /* image pas prête */ }
          scan.timer = setTimeout(loop, 180);
        };
        loop();
      } else {
        // iPhone et navigateurs sans détecteur intégré : bibliothèque ZXing (gardée pour le hors ligne)
        const { BrowserMultiFormatReader } = await import(ZXING);
        const reader = new BrowserMultiFormatReader();
        scan.controls = await reader.decodeFromConstraints({ video: { facingMode: "environment" } }, video, r => { if (r) found(r.getText()); });
      }
    } catch (e) { $("scanStatus").textContent = t("noCam"); }
  }

  function stopScanner() {
    clearTimeout(scan.timer);
    scan.stream?.getTracks().forEach(tr => tr.stop()); scan.stream = null;
    try { scan.controls?.stop(); } catch { /* déjà arrêté */ } scan.controls = null;
    $("video").srcObject = null;
  }

  async function found(raw) {
    if (scan.busy) return true;
    const isbn = isbnValide(raw);
    if (!isbn) { $("scanStatus").textContent = t("badIsbn"); return false; }
    scan.busy = true;
    navigator.vibrate?.(60);
    stopScanner(); $("scanner").close();
    openFiche(isbn);
    return true;
  }

  // ---------- Fiche produit ----------
  const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString(lang === "fr" ? "fr-FR" : "en-GB", { day: "numeric", month: "long", year: "numeric" });
  const joursAvant = d => Math.round((new Date(d + "T00:00:00") - new Date(new Date().toDateString())) / 86400000);
  const fmtPrix = (p, dev) => { try { return new Intl.NumberFormat(lang === "fr" ? "fr-FR" : "en-GB", { style: "currency", currency: dev || "EUR" }).format(p); } catch { return `${p} ${dev ?? ""}`; } };

  async function chercherFiche(isbn) {
    // 1. copie locale (marche hors ligne)
    const sid = ((await local.get("isbnIndex")) ?? {})[isbn];
    let v = null;
    if (sid) {
      const vols = (await local.get(`vols:${sid}`)) ?? [];
      const vl = vols.find(x => x.isbn13 === isbn);
      const s = state.series.find(x => x.id === +sid);
      if (vl && s) v = { ...vl, series: s };
    }
    if (isOffline()) return v;
    // 2. en ligne : fiche complète (description, prix, date…), créée si le tome n'existe pas encore
    if (v && v.fiche_maj) return v;
    try {
      const r = await fetch(`${URL_SB}/functions/v1/recherche`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fiche: isbn }) });
      const res = await r.json();
      if (res.volume) {
        const { series: s, ...vol } = res.volume;
        const cached = (await local.get(`vols:${vol.serie_id}`)) ?? [];
        await rememberVols(vol.serie_id, [...cached.filter(x => x.id !== vol.id), vol].sort((a, b) => a.numero - b.numero));
        if (!state.series.some(x => x.id === s.id)) await loadSeries();
        return res.volume;
      }
    } catch { /* réseau perdu en route */ }
    return v;
  }

  async function openFiche(isbn) {
    const body = $("ficheBody");
    body.innerHTML = `<p class="scan-status">${t("loading")}</p>`;
    if (!$("fiche").open) $("fiche").showModal();
    const v = await chercherFiche(isbn);
    if (!v && isOffline()) return renderScanEnAttente(isbn);
    if (!v) { body.innerHTML = `<p class="empty">${t("notFound")}<br><span class="isbn">${esc(isbn)}</span></p>`; return; }
    renderFiche(v);
  }

  function renderFiche(v) {
    const s = v.series ?? {};
    const e = state.coll.get(v.id) ?? { quantite: 0, souhait: false };
    const img = v.couverture_url || `https://covers.openlibrary.org/b/isbn/${v.isbn13}-M.jpg?default=false`;
    let date = "—";
    if (v.date_parution) {
      const n = joursAvant(v.date_parution);
      date = esc(fmtDate(v.date_parution)) + (n >= 0 ? ` <span class="soon">${t("soonOut")} · ${t("inDays", n)}</span>` : "");
    }
    const nom = v.titre || `${s.titre ?? ""}${s.edition ? " - " + s.edition : ""} - ${t("volL")} ${v.numero}`;
    const actions = e.quantite > 0
      ? `<div class="qty"><button data-a="minus" aria-label="${esc(t("removeOne"))}">−</button><span>×${e.quantite}${e.quantite > 1 ? ` · ${t("doubles", e.quantite - 1)}` : ""}</span><button data-a="plus" aria-label="${esc(t("addOne"))}">+</button></div>`
      : `<button class="btn" data-a="own">${t("own")}</button><button class="btn ghost" data-a="wish">${e.souhait ? "♥" : "♡"} ${t("wishT")}</button>`;
    $("ficheBody").innerHTML = `<div class="prod">
        <div class="cover">${v.numero}<img src="${esc(img)}" alt="" style="position:absolute;inset:0" onerror="this.remove()"></div>
        <div><h4>${esc(nom)}</h4><div class="meta">${esc([s.titre, s.edition].filter(Boolean).join(" · "))}</div>
          <dl><dt>${t("publisher")}</dt><dd>${esc(s.editeur ?? "—")}</dd>
              <dt>${t("isbnL")}</dt><dd class="isbn" style="font-size:13px">${esc(v.isbn13)}</dd>
              <dt>${t("release")}</dt><dd>${date}</dd>
              <dt>${t("price")}</dt><dd>${v.prix != null ? esc(fmtPrix(v.prix, v.devise)) : `<span class="meta">${t("priceUnknown")}</span>`}</dd>
              <dt>${t("langL")}</dt><dd>${esc(t("langs")[s.langue] ?? s.langue ?? "—")}</dd></dl></div></div>
      ${v.description ? `<p class="desc short" id="desc">${esc(v.description)}</p><button class="link" id="descMore">${t("more")}</button>
        ${s.langue && s.langue !== lang ? `<p class="meta" style="font-size:12px">${t("descOther")}</p>` : ""}` : ""}
      <div class="prod-actions">${actions}</div>
      <div class="prod-actions"><button class="btn ghost" id="seeSerie">${t("seeSerie")}</button></div>`;
    const more = $("descMore");
    if (more) more.onclick = () => { const d = $("desc"); d.classList.toggle("short"); more.textContent = d.classList.contains("short") ? t("more") : t("less"); };
    $("seeSerie").onclick = () => { $("fiche").close(); openSerie(v.serie_id); };
    $("ficheBody").querySelectorAll("button[data-a]").forEach(b => b.onclick = async () => {
      const cur = state.coll.get(v.id) ?? { quantite: 0, souhait: false };
      const patch = { own: { quantite: 1 }, plus: { quantite: cur.quantite + 1 }, minus: { quantite: cur.quantite - 1 }, wish: { souhait: !cur.souhait } }[b.dataset.a];
      await setEntry(v.id, patch);
      if (state.user) renderFiche(v);
    });
  }

  // ---------- Scans faits sans réseau ----------
  function renderScanEnAttente(isbn) {
    $("ficheBody").innerHTML = `<p class="tip">${esc(t("offlineScan", isbn))}</p><p class="meta" style="margin-top:14px">${t("offlineScanAs")}</p>
      <div class="prod-actions"><button class="btn" data-k="own">${t("keepOwn")}</button><button class="btn ghost" data-k="wish">${t("keepWish")}</button>
      <button class="btn ghost" data-k="look">${t("keepLook")}</button></div>`;
    $("ficheBody").querySelectorAll("button[data-k]").forEach(b => b.onclick = async () => {
      const scans = ((await local.get("scans")) ?? []).filter(x => x.isbn !== isbn);
      scans.push({ isbn, action: b.dataset.k, at: new Date().toISOString() });
      await local.set("scans", scans);
      $("fiche").close(); updateOffline(); if (state.view === "collection") render();
    });
  }

  async function resolveScans() {
    if (isOffline()) return;
    let scans = (await local.get("scans")) ?? [];
    if (!scans.length) return;
    let ok = 0, ko = 0;
    for (const sc of [...scans]) {
      let v = null;
      try {
        const r = await fetch(`${URL_SB}/functions/v1/recherche`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fiche: sc.isbn }) });
        v = (await r.json()).volume;
      } catch { break; } // réseau reperdu : on garde le reste pour plus tard
      if (v && state.user && sc.action !== "look") await setEntry(v.id, sc.action === "own" ? { quantite: Math.max(1, state.coll.get(v.id)?.quantite ?? 0) } : { souhait: true });
      v ? ok++ : ko++;
      scans = scans.filter(x => x.isbn !== sc.isbn);
      await local.set("scans", scans);
    }
    await loadSeries();
    say([ok ? t("scansDone", ok) : "", ko ? t("scansFailed", ko) : ""].filter(Boolean).join(" "));
    updateOffline(); render();
  }

  $("scanBtn").onclick = openScanner;
  $("scanClose").onclick = () => { stopScanner(); $("scanner").close(); };
  $("scanner").addEventListener("close", stopScanner);
  $("ficheClose").onclick = () => $("fiche").close();
  $("manualForm").addEventListener("submit", e => { e.preventDefault(); found($("manualIsbn").value); });

  // ---------- Application installable + hors ligne ----------
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
  let installEvt = null;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("installBtn").classList.add("show"); });
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone) $("installBtn").classList.add("show");
  $("installBtn").onclick = async () => {
    if (installEvt) { installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("installBtn").classList.remove("show"); }
    else say(t("iosInstall"));
  };
  addEventListener("online", async () => { await flushQueue(); await loadSeries(); await loadUser(); render(); await resolveScans(); await syncCatalogue(); prefetchForOffline(); });
  addEventListener("offline", () => updateOffline());

  applyI18n();
  await loadSeries();
  await loadUser();
  render();
  flushQueue().then(resolveScans).then(syncCatalogue).then(prefetchForOffline);
  // sans détecteur intégré, on garde ZXing en réserve pour pouvoir scanner hors ligne
  if (!("BarcodeDetector" in window) && !isOffline()) setTimeout(() => import(ZXING).catch(() => {}), 4000);
</script>
</body>
</html>
