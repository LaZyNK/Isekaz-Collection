<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isekaz Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12111a; --panel: #1c1b27; --line: #2d2b3d; --text: #ecebf3;
    --muted: #9a98ad; --accent: #ff6b3d; --accent-2: #ffc23d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px;
           padding: 16px clamp(16px, 4vw, 40px); border-bottom: 1px solid var(--line);
           position: sticky; top: 0; background: rgba(18,17,26,.92); backdrop-filter: blur(8px); z-index: 2; }
  h1 { font-family: "Bebas Neue", sans-serif; font-size: 32px; letter-spacing: 1px; margin: 0; }
  h1 span { color: var(--accent); }
  input { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 10px;
          padding: 10px 14px; font: inherit; width: min(320px, 50vw); }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  main { padding: 24px clamp(16px, 4vw, 40px); max-width: 1200px; margin: 0 auto; }
  .series { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; cursor: pointer;
          transition: transform .15s, border-color .15s; }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card h2 { font-family: "Bebas Neue", sans-serif; font-size: 26px; margin: 0 0 4px; letter-spacing: .5px; }
  .meta { color: var(--muted); font-size: 14px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 14px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .back { background: none; border: none; color: var(--accent); font: inherit; cursor: pointer; padding: 0; margin-bottom: 16px; }
  .vols { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; margin-top: 20px; }
  .vol { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .vol.missing { opacity: .45; border-style: dashed; }
  .cover { aspect-ratio: 2/3; background: #26243a; display: grid; place-items: center;
           font-family: "Bebas Neue", sans-serif; font-size: 44px; color: var(--muted); }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .vol div.info { padding: 8px 10px; font-size: 13px; }
  .isbn { font-family: ui-monospace, monospace; color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Isekaz <span>Collection</span></h1>
  <input id="q" type="search" placeholder="Chercher une série ou un ISBN…" autocomplete="off">
</header>
<main id="app"><p class="empty">Chargement…</p></main>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  // Clé publique (lecture seule grâce aux règles RLS) — la clé service_role ne va JAMAIS ici.
  const db = createClient(
    "https://rohiqowmjtcrrailkgdb.supabase.co",
    "sb_publishable_626JHq5Ylaj9hbhs9mZKrA_ildFkUoA"
  );
  const app = document.getElementById("app");
  const q = document.getElementById("q");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let series = [];

  async function load() {
    const { data, error } = await db.from("series").select("*, volumes(count)").order("titre");
    if (error) { app.innerHTML = `<p class="empty">Erreur : ${esc(error.message)}</p>`; return; }
    series = data;
    renderList();
  }

  function renderList(filter = "") {
    const f = filter.toLowerCase();
    const list = series.filter(s => `${s.titre} ${s.edition ?? ""} ${s.editeur ?? ""}`.toLowerCase().includes(f));
    if (!list.length) { app.innerHTML = `<p class="empty">Aucune série trouvée.</p>`; return; }
    app.innerHTML = `<div class="series">${list.map(s => {
      const n = s.volumes[0]?.count ?? 0, total = s.nb_tomes || n || 1;
      return `<div class="card" data-id="${s.id}">
        <h2>${esc(s.titre)}</h2>
        <div class="meta">${esc(s.edition ?? "")}${s.edition ? " · " : ""}${esc(s.editeur ?? "")}</div>
        <div class="meta">${n} / ${s.nb_tomes ?? "?"} tomes référencés</div>
        <div class="bar"><i style="width:${Math.min(100, n / total * 100)}%"></i></div>
      </div>`;
    }).join("")}</div>`;
    app.querySelectorAll(".card").forEach(c => c.onclick = () => openSerie(+c.dataset.id));
  }

  async function openSerie(id) {
    const s = series.find(x => x.id === id);
    const { data: vols } = await db.from("volumes").select("*").eq("serie_id", id).order("numero");
    const byNum = Object.fromEntries((vols ?? []).map(v => [v.numero, v]));
    const max = Math.max(s.nb_tomes ?? 0, ...(vols ?? []).map(v => v.numero), 0);
    const cells = Array.from({ length: max }, (_, i) => {
      const v = byNum[i + 1];
      if (!v) return `<div class="vol missing"><div class="cover">${i + 1}</div><div class="info">Tome ${i + 1}<br><span class="isbn">ISBN manquant</span></div></div>`;
      const img = v.couverture_url || `https://covers.openlibrary.org/b/isbn/${v.isbn13}-M.jpg?default=false`;
      return `<div class="vol"><div class="cover"><img src="${esc(img)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${v.numero}'))"></div>
        <div class="info">Tome ${v.numero}<br><span class="isbn">${esc(v.isbn13 ?? "")}</span></div></div>`;
    }).join("");
    app.innerHTML = `<button class="back">← Toutes les séries</button>
      <h2 style="font-family:'Bebas Neue';font-size:40px;margin:0">${esc(s.titre)}</h2>
      <div class="meta">${esc(s.edition ?? "")} · ${esc(s.editeur ?? "")} · ${esc(s.auteur ?? "")}</div>
      <div class="vols">${cells}</div>`;
    app.querySelector(".back").onclick = () => renderList(q.value);
  }

  q.addEventListener("input", async () => {
    const v = q.value.trim(), digits = v.replace(/[^0-9]/g, "");
    if (digits.length === 13) {
      const { data } = await db.from("volumes").select("serie_id").eq("isbn13", digits).maybeSingle();
      if (data) return openSerie(data.serie_id);
    }
    renderList(v);
  });

  load();
</script>
</body>
</html>
