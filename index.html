  $("authForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("aErr").textContent = "";
    const email = $("aEmail").value.trim(), password = $("aPass").value;
    if (mode === "signup") {
      const pseudo = $("aPseudo").value.trim();
      const { data: pris } = await db.from("profiles").select("id").ilike("pseudo", pseudo).maybeSingle();
      if (pris) { $("aErr").textContent = t("pseudoTaken"); return; }
      const { data, error } = await db.auth.signUp({ email, password, options: { data: { pseudo }, emailRedirectTo: location.origin + location.pathname } });
      if (error) { $("aErr").textContent = error.message; return; }
      $("auth").close();
      if (!data.session) say(t("checkMail"));
    } else {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) { $("aErr").textContent = t("badLogin"); return; }
      $("auth").close();
    }
  });
  db.auth.onAuthStateChange(() => { loadUser().then(render); });

  // ---------- Collection ----------
  async function setEntry(volumeId, patch) {
    if (!state.user) { openAuth("login"); say(t("loginFirst")); return; }
    const cur = state.coll.get(volumeId) ?? { volume_id: volumeId, quantite: 0, souhait: false, lu: false };
    const next = { ...cur, ...patch };
    if ("lu" in patch) next.lu_le = patch.lu ? new Date().toISOString() : null;
    next.quantite = Math.max(0, Math.min(99, next.quantite));
    if (next.quantite > 0) next.souhait = false; // on l'a : il sort de la liste de souhaits
    const at = new Date().toISOString();
    let error = null;
    if (!isOffline() && !Object.keys(await queueGet()).length) {
      ({ error } = (next.quantite === 0 && !next.souhait && !next.lu)
        ? await db.from("collection").delete().eq("volume_id", volumeId).eq("user_id", state.user.id)
        : await db.from("collection").upsert({ user_id: state.user.id, volume_id: volumeId, quantite: next.quantite,
            souhait: next.souhait, lu: !!next.lu, lu_le: next.lu_le ?? null, updated_at: at }, { onConflict: "user_id,volume_id" }));
      if (error && !netError(error)) { say(t("error") + error.message); return; }
    }
    if (isOffline() || error || Object.keys(await queueGet()).length) {
      const qu = await queueGet();
      qu[volumeId] = { volume_id: volumeId, quantite: next.quantite, souhait: next.souhait, lu: !!next.lu, lu_le: next.lu_le ?? null, at };
      await queueSet(qu);
    }
    if (!next.serie_id) for (const { vols } of mem.values()) { const v = vols.find(x => x.id === volumeId); if (v) { next.serie_id = v.serie_id; break; } }
    if (next.quantite === 0 && !next.souhait && !next.lu) state.coll.delete(volumeId); else state.coll.set(volumeId, next);
    await saveColl();
    renderAccount(); render(); updateOffline();
    if (!isOffline()) flushQueue();
  }

  // ---------- Données ----------
  async function loadSeries() {
    // le serveur renvoie 1000 lignes maximum par demande : on lit le catalogue par paquets
    let data = [], error = null;
    for (let from = 0; ; from += 1000) {
      const r = await avecDelai(db.from("series").select("*, volumes(count)").order("titre").order("id").range(from, from + 999), 10000);
      if (r.error) { error = r.error; break; }
      data.push(...r.data);
      if (r.data.length < 1000) break;
    }
    if (!error) { state.series = data; await local.set("series", data); return; }
    state.series = (await local.get("series")) ?? [];
    if (!netError(error)) say(t("error") + error.message);
  }

  async function searchOnline(text) {
    const digits = text.replace(/[^0-9]/g, "");
    const body = digits.length === 13 ? { isbn: digits } : { q: text };
    if (isOffline()) { say(t("offlineSearch")); return; }
    if (body.isbn) say(t("searchingIsbn")); else if (!notice.textContent) say(t("searching", text));
    try {
      const r = await fetch(`${URL_SB}/functions/v1/recherche`, { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const res = await r.json();
      if (res.error) { say(res.error); return; }
      await loadSeries();
      if (!res.series?.length) { say(t("nothing")); return; }
      if (body.isbn) { say(res.source === "ajout" ? t("added") : ""); const se = state.series.find(x => x.id === res.series[0]);
        return se ? openOeuvre(cleOeuvre(se)) : openSerie(res.series[0]); }
      say(res.source === "ajout" ? t("foundN", res.series.length) : "");
      state.view = "catalogue"; state.filterIds = new Set(res.series); render();
    } catch (e) { say(t("offline")); }
  }

  // ---------- Affichage ----------
  function say(x) { notice.textContent = x || ""; }

  function serieCard(s) {
    const n = s.volumes[0]?.count ?? 0, total = s.nb_tomes || n || 1;
    return `<div class="card" data-id="${s.id}" tabindex="0" role="button">
      <span class="flag">${esc((s.langue || "fr").toUpperCase())}${s.type && s.type !== "manga" ? " · " + esc(t("types")[s.type] ?? s.type) : ""}</span>
      <h2>${esc(s.titre)}</h2>
      <div class="meta">${esc(s.edition ?? "")}${s.edition ? " · " : ""}${esc(s.editeur ?? "")}</div>
      <div class="meta">${t("volsRef", n)}${s.nb_tomes ? ` / ${s.nb_tomes}` : ""}${s.public ? ` · <span style="color:var(--sakura)">${esc(t("publics")[s.public])}</span>` : ""}</div>
      <div class="progress"><i style="width:${s.nb_tomes ? Math.min(100, n / total * 100) : 100}%"></i></div></div>`;
  }
  // Une « œuvre » = toutes les éditions d'un même titre (éditeurs, formats, langues…)
  const cleOeuvre = x => (x.titre || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  function regrouper(eds) {
    const m = new Map();
    for (const e of eds) { const k = cleOeuvre(e); if (!m.has(k)) m.set(k, { key: k, eds: [] }); m.get(k).eds.push(e); }
    return [...m.values()];
  }
  function oeuvreCard(o) {
    const eds = o.eds, n = eds.reduce((a, e) => a + (e.volumes[0]?.count ?? 0), 0);
    const titre = eds.map(e => e.titre).sort((a, b) => [...b].filter(c => c !== c.toLowerCase()).length - [...a].filter(c => c !== c.toLowerCase()).length)[0];
    const editeurs = [...new Set(eds.map(e => e.editeur).filter(Boolean))].slice(0, 3);
    const langs = [...new Set(eds.map(e => (e.langue || "fr").toUpperCase()))].join(" · ");
    const types = [...new Set(eds.map(e => e.type || "manga"))].filter(x => x !== "manga").map(x => t("types")[x]);
    const pub = eds.map(e => e.public).find(Boolean);
    return `<div class="card" data-oeuvre="${esc(o.key)}" tabindex="0" role="button">
      <span class="flag">${esc([langs, ...types].join(" · "))}</span>
      <h2>${esc(titre)}</h2>
      <div class="meta">${esc(editeurs.join(" · "))}${eds.length > 1 ? ` · ${t("nEditions", eds.length)}` : ""}</div>
      <div class="meta">${t("volsRef", n)}${pub ? ` · <span style="color:var(--sakura)">${esc(t("publics")[pub])}</span>` : ""}</div>
      <div class="progress"><i style="width:100%"></i></div></div>`;
  }
  function bindCards() {
    app.querySelectorAll(".card[data-oeuvre]").forEach(c => {
      c.onclick = () => openOeuvre(c.dataset.oeuvre);
      c.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openOeuvre(c.dataset.oeuvre); } };
    });
  }

  function langFilters() {
    const counts = {};
    state.series.forEach(s => counts[s.langue || "fr"] = (counts[s.langue || "fr"] || 0) + 1);
    const codes = Object.keys(counts).sort((a, b) => (a === lang ? -1 : b === lang ? 1 : counts[b] - counts[a]));
    if (codes.length < 2 && state.editionLangs.has(codes[0])) return "";
    return `<div class="filters"><span class="label">${t("editionLang")}</span>${codes.map(c => `
      <label class="chip ${state.editionLangs.has(c) ? "on" : ""}"><input type="checkbox" data-lang="${c}" ${state.editionLangs.has(c) ? "checked" : ""}>
      ${esc(t("langs")[c] ?? c.toUpperCase())} <small>${counts[c]}</small></label>`).join("")}</div>`;
  }
  // Filtres « type » et « public » : rien de coché = tout afficher
  function chipFilters(label, field, set, names, attr) {
    const counts = {};
    state.series.forEach(s => { const k = s[field] || (field === "type" ? "manga" : null); if (k) counts[k] = (counts[k] || 0) + 1; });
    const codes = Object.keys(names).filter(c => counts[c]);
    if (!codes.length) return "";
    return `<div class="filters"><span class="label">${label}</span>${codes.map(c => `
      <label class="chip ${set.has(c) ? "on" : ""}"><input type="checkbox" ${attr}="${c}" ${set.has(c) ? "checked" : ""}>
      ${esc(names[c])} <small>${counts[c]}</small></label>`).join("")}</div>`;
  }
  function genreFilters() {
    const counts = {};
    regrouper(state.series).forEach(o => new Set(o.eds.flatMap(e => e.genres ?? [])).forEach(g => counts[g] = (counts[g] || 0) + 1));
    const codes = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 16);
    if (!codes.length) return "";
    return `<div class="filters"><span class="label">${t("genreL")}</span>${codes.map(c => `
      <label class="chip ${state.genresF.has(c) ? "on" : ""}"><input type="checkbox" data-genre="${esc(c)}" ${state.genresF.has(c) ? "checked" : ""}>
      ${esc(t("genresL")[c] ?? c)} <small>${counts[c]}</small></label>`).join("")}</div>`;
  }
  function bindFilters() {
    for (const [attr, set, key] of [["data-type", state.types, "isekaz.types"], ["data-public", state.publics, "isekaz.publics"], ["data-genre", state.genresF, "isekaz.genres"]]) {
      app.querySelectorAll(`.filters input[${attr}]`).forEach(i => i.onchange = () => {
        const v = i.getAttribute(attr);
        i.checked ? set.add(v) : set.delete(v);
        store.set(key, [...set]); state.limit = 60; renderCatalogue();
      });
    }
    app.querySelectorAll(".filters input[data-lang]").forEach(i => i.onchange = () => {
      i.checked ? state.editionLangs.add(i.dataset.lang) : state.editionLangs.delete(i.dataset.lang);
      store.set("isekaz.editionLangs", [...state.editionLangs]);
      renderCatalogue();
    });
  }

  function hero() {
    const vols = state.series.reduce((a, s) => a + (s.volumes[0]?.count ?? 0), 0);
    return `<section class="hero">
      <div class="hero-art"><img src="assets/isekaz-512.jpg" alt="Isekaz" width="512" height="512"></div>
      <div><div class="kanji">異世界 · コレクション</div>
        <h2>Isekaz <span>Collection</span></h2>
        <p><b style="color:var(--white)">${t("heroTag")}.</b> ${t("heroText")}</p>
        <div class="hero-stats">${state.user ? (() => {
          const st = stats();
          const suivies = new Set([...state.coll.values()].filter(r => r.quantite > 0).map(r => r.serie_id).filter(Boolean)).size;
          return `<div><b>${suivies}</b>${t("statMySeries")}</div><div><b>${st.possedes}</b>${t("statMyVols")}</div>
            <div><b>${t("lvl")} ${st.niveau}</b>${t("statLevel")}</div>`;
        })() : `<div><b>${regrouper(state.series).length}</b>${t("statSeries")}</div><div><b>${vols}</b>${t("statVols")}</div>`}</div>
      </div></section>`;
  }

  function renderCatalogue() {
    const f = q.value.trim().toLowerCase();
    let list = state.series;
    if (state.filterIds) list = list.filter(s => state.filterIds.has(s.id));
    else if (f && !/^\d{13}$/.test(f.replace(/[^0-9]/g, ""))) list = list.filter(s => `${s.titre} ${s.edition ?? ""} ${s.editeur ?? ""}`.toLowerCase().includes(f));
    list = list.filter(s => (!state.types.size || state.types.has(s.type || "manga")) && (!state.publics.size || state.publics.has(s.public))
      && (!state.genresF.size || (s.genres ?? []).some(g => state.genresF.has(g))));
    const visible = regrouper(list.filter(s => state.editionLangs.has(s.langue || "fr")));
    const hidden = regrouper(list).length - visible.length;
    const showHero = !f && !state.filterIds;
    app.innerHTML = (showHero ? hero() : "") + chipFilters(t("typeL"), "type", state.types, t("types"), "data-type")
      + chipFilters(t("publicL"), "public", state.publics, t("publics"), "data-public") + genreFilters() + langFilters() +
      `<h3 class="section-title">${TORII}${showHero ? t("allSeries") : t("results")}</h3>` +
      (visible.length ? `<div class="series">${visible.slice(0, state.limit).map(oeuvreCard).join("")}</div>` : "") +
      (visible.length > state.limit ? `<p style="text-align:center;margin-top:20px"><button class="btn ghost" id="moreBtn">${t("showMore", visible.length - state.limit)}</button></p>` : "") +
      (hidden ? `<p class="empty">${t("hiddenByLang", hidden)}</p>` : "") +
      (!list.length ? `<p class="empty">${t("notHere")}</p>` : "");
    bindFilters(); bindCards();
    const more = $("moreBtn");
    if (more) more.onclick = () => { state.limit += 60; renderCatalogue(); };
  }

  function volCell(v, num, nSpe = 0) {
    if (!v) return `<div class="vol missing"><div class="cover">${num}</div><div class="info">${t("tome")} ${num}<br><span class="isbn">${t("missingIsbn")}</span></div></div>`;
    const e = state.coll.get(v.id) ?? { quantite: 0, souhait: false };
    const img = v.photo_url || v.couverture_url || (v.isbn13 ? `https://covers.openlibrary.org/b/isbn/${v.isbn13}-M.jpg?default=false` : "");
    const badge = e.quantite > 1 ? `<span class="badge dbl">${t("doubles", e.quantite - 1)}</span>`
      : e.quantite === 1 ? `<span class="badge">✓</span>` : "";
    const own = e.quantite > 0
      ? `<div class="qty"><button data-a="minus" title="${esc(t("removeOne"))}" aria-label="${esc(t("removeOne"))}">−</button><span>×${e.quantite}</span><button data-a="plus" title="${esc(t("addOne"))}" aria-label="${esc(t("addOne"))}">+</button></div>`
      : `<button data-a="own">${t("own")}</button>`;
    const wish = e.quantite > 0 ? "" : `<button data-a="wish" class="${e.souhait ? "on-wish" : ""}" title="${esc(t("wishT"))}" aria-label="${esc(t("wishT"))}" aria-pressed="${e.souhait}">${e.souhait ? "♥" : "♡"}</button>`;
    return `<div class="vol ${e.quantite > 0 ? "owned" : e.souhait ? "wished" : ""}" data-vid="${v.id}">
      <div class="cover">${v.numero}<img src="${esc(img)}" alt="" loading="lazy" style="position:absolute;inset:0" onerror="this.remove()">${badge}</div>
      <div class="info">${v.variante ? `<span class="soon" style="margin:0 0 4px">${esc(t("variantes")[v.variante] ?? v.variante)}</span><br>` : ""}${v.titre && v.serie_type && v.serie_type !== "manga" ? esc(v.titre) : `${t("tome")} ${v.numero}`}
        ${v.variante_nom ? `<br><span class="meta" style="font-size:12px">${esc(v.variante_nom)}</span>` : ""}${v.contenu ? `<br><span class="meta" style="font-size:12px">${esc(v.contenu)}</span>` : ""}
        <br><span class="isbn">${esc(v.isbn13 ?? "")}</span>${nSpe ? `<br><button class="link" data-a="specials" style="font-size:12px">${t("nSpecials", nSpe)}</button>` : ""}</div>
      <div class="actions">${own}${wish}</div></div>`;
  }

  function bindVols() {
    app.querySelectorAll(".vol[data-vid]").forEach(el => {
      const id = +el.dataset.vid;
      el.querySelectorAll("button[data-a]").forEach(b => b.onclick = () => {
        const e = state.coll.get(id) ?? { quantite: 0, souhait: false };
        if (b.dataset.a === "own") setEntry(id, { quantite: 1 });
        if (b.dataset.a === "plus") setEntry(id, { quantite: e.quantite + 1 });
        if (b.dataset.a === "minus") setEntry(id, { quantite: e.quantite - 1 });
        if (b.dataset.a === "wish") setEntry(id, { souhait: !e.souhait });
        if (b.dataset.a === "specials") $("specials")?.scrollIntoView({ behavior: "smooth" });
      });
    });
  }

  async function openSerie(id) {
    const first = state.view !== "serie" || state.serie !== id;
    state.view = "serie"; state.serie = id; state.filterIds = null;
    if (first) { chargement(); window.scrollTo({ top: 0 }); }
    const s = state.series.find(x => x.id === id) ?? (await avecDelai(db.from("series").select("*, volumes(count)").eq("id", id).single())).data;
    if (!s) { state.view = "catalogue"; return render(); }
    const { data: vols, error } = await avecDelai(db.from("volumes").select("*").eq("serie_id", id).order("numero"));
    if (!error) await rememberVols(id, vols);
    state.vols = error ? (await local.get(`vols:${id}`)) ?? [] : vols ?? [];
    if (error && !state.vols.length) { app.innerHTML = `<button class="back">${t("back")}</button><p class="empty">${t("notCached")}</p>`;
      app.querySelector(".back").onclick = () => { state.view = "catalogue"; render(); }; setNav(); return; }
    state.vols = state.vols.map(v => ({ ...v, serie_type: s.type }));
    const normaux = state.vols.filter(v => !v.variante), speciales = state.vols.filter(v => v.variante);
    const byNum = Object.fromEntries(normaux.map(v => [v.numero, v]));
    const nSpe = {}; speciales.forEach(v => nSpe[v.numero] = (nSpe[v.numero] || 0) + 1);
    const max = Math.max(s.nb_tomes ?? 0, ...normaux.map(v => v.numero), 0);
    const owned = normaux.filter(v => (state.coll.get(v.id)?.quantite ?? 0) > 0).length;
    app.innerHTML = `<button class="back">${t("back")}</button>
      <div class="title-row"><div>
        <h2>${esc(s.titre)}</h2>
        <div class="meta">${[s.edition, s.editeur, s.auteur, s.public ? t("publics")[s.public] : null, s.type && s.type !== "manga" ? t("types")[s.type] : null,
          (s.langue || "fr").toUpperCase()].filter(Boolean).map(esc).join(" · ")}</div>
        ${state.user ? `<div class="meta" style="color:var(--sakura)">${t("youHave", owned, max)}</div>` : ""}
      </div>${state.user && normaux.length ? `<button class="btn ghost" id="allBtn">${t("haveAll")}</button>` : ""}</div>
      <div class="vols">${Array.from({ length: max }, (_, i) => volCell(byNum[i + 1], i + 1, nSpe[i + 1] || 0)).join("")}</div>
      <h3 class="section-title" id="specials" style="margin-top:30px">✦ ${t("specials")}${speciales.length ? ` <small class="meta" style="font-family:Inter;font-size:14px">${speciales.length}</small>` : ""}</h3>
      ${speciales.length ? `<div class="vols">${speciales.map(v => volCell(v, v.numero)).join("")}</div>` : ""}
      <p style="margin-top:14px"><button class="btn ghost" id="addSpecialBtn">${t("addSpecial")}</button></p>`;
    $("addSpecialBtn").onclick = () => openAjout({ mode: "variante", serie: s, numero: 1, max: Math.max(max, 1) });
    app.querySelector(".back").onclick = () => { state.view = "oeuvre"; state.oeuvre = cleOeuvre(s); render(); };
    const all = $("allBtn");
    if (all) all.onclick = async () => {
      const rows = normaux.filter(v => !(state.coll.get(v.id)?.quantite > 0))
        .map(v => ({ user_id: state.user.id, volume_id: v.id, quantite: 1, souhait: false }));
      if (!rows.length) return;
      const { error } = await db.from("collection").upsert(rows, { onConflict: "user_id,volume_id" });
      if (error) return say(t("error") + error.message);
      rows.forEach(r => state.coll.set(r.volume_id, r)); renderAccount(); render();
    };
    bindVols();
    setNav();
    if (first) window.scrollTo({ top: 0 });
  }

  async function renderMine(kind) {
    if (!state.user) { app.innerHTML = `<p class="empty">${t("loginToSee", kind)}</p>`; return; }
    const first = state.mineVue !== kind; state.mineVue = kind;
    const ids = [...state.coll.values()].filter(r => kind === "souhaits" ? r.souhait : kind === "pile" ? r.quantite > 0 && !r.lu : r.quantite > 0).map(r => r.volume_id);
    const onglets = `<div class="tabs-mine">${["collection", "pile", "souhaits"].map(k => `<button data-mine="${k}" class="${k === kind ? "on" : ""}">${t("tab_" + k)}${
      k === "pile" ? ` <small>${stats().pile}</small>` : k === "souhaits" ? ` <small>${stats().souhaits}</small>` : ""}</button>`).join("")}</div>`;
    const st = stats();
    const head = onglets + (kind === "collection" ? `<div class="stats">
      <div class="stat"><b>${st.possedes}</b>${t("tomes")}</div><div class="stat"><b>${st.lus}</b>${t("readL")}</div>
      <div class="stat"><b>${st.doubles}</b>${t("doublesL")}</div></div>` : kind === "pile" ? `<p class="meta" style="margin:0 0 14px">${t("pileHint")}</p>` : "");
    const scans = kind === "collection" ? (await local.get("scans")) ?? [] : [];
    const pend = scans.length ? `<div class="tip pending-scans"><b style="color:var(--white)">${t("pendingScans", scans.length)}</b>
      <ul>${scans.map(x => `<li>${esc(x.isbn)} — ${x.action === "own" ? t("keepOwn") : x.action === "wish" ? t("keepWish") : t("keepLook")}</li>`).join("")}</ul></div>` : "";
    if (!ids.length) { app.innerHTML = pend + head + `<p class="empty">${kind === "souhaits" ? t("emptyWish") : kind === "pile" ? t("emptyPile") : t("emptyColl")}</p>`; bindOnglets(); return; }

    // 1. tout de suite : ce qu'on a déjà en mémoire
    const want = new Set(ids);
    state.mineCache ??= {};
    state.mineCache[kind] ??= (await local.get(`mine:${state.user.id}:${kind}`)) ?? [];
    let vols = state.mineCache[kind].filter(v => want.has(v.id));
    if (vols.length < ids.length) { // tomes cochés depuis : on les complète avec la mémoire des séries
      const deja = new Set(vols.map(v => v.id));
      for (const { vols: vs } of mem.values()) for (const v of vs) if (want.has(v.id) && !deja.has(v.id)) {
        deja.add(v.id); vols.push({ ...v, series: state.series.find(x => x.id === v.serie_id) });
      }
    }
    if (vols.length) dessinerMine(kind, pend + head, vols, first); else if (first) chargement();
    // 2. puis la version à jour du serveur
    const { data, error } = await avecDelai(db.from("volumes").select("*, series(id, titre, edition, editeur, langue, type, volumes(count))").in("id", ids).order("numero"));
    if (state.view !== kind) return;
    data?.sort((a, b) => a.numero - b.numero);
    if (error) { if (!vols.length) dessinerMine(kind, pend + head, vols, first); return; }
    state.mineCache[kind] = data;
    local.set(`mine:${state.user.id}:${kind}`, data);
    if (signature(vols) !== signature(data) || vols.length !== data.length) dessinerMine(kind, pend + head, data, false);
  }

  function bindOnglets() {
    app.querySelectorAll("[data-mine]").forEach(b => b.onclick = () => { state.view = b.dataset.mine; render(); });
  }

  function dessinerMine(kind, haut, vols, first) {
    state.ouverts ??= new Set(store.get("isekaz.ouverts", []));
    const hauteur = window.scrollY;
    const positions = Object.fromEntries([...app.querySelectorAll(".row[data-row]")].map(r => [r.dataset.row, r.scrollLeft]));
    const parSerie = new Map();
    vols.forEach(v => { const sid = v.serie_id ?? v.series?.id; (parSerie.get(sid) ?? parSerie.set(sid, []).get(sid)).push(v); });
    const filtre = (state.filtreMine ?? "").toLowerCase();
    let groupes = [...parSerie.entries()].map(([sid, vs]) => {
      const se = state.series.find(x => x.id === sid) ?? vs[0].series ?? {};
      const total = se.volumes?.[0]?.count ?? vs.length;
      return { sid, se, vs: vs.sort((a, b) => a.numero - b.numero), total };
    }).filter(g => !filtre || `${g.se.titre} ${g.se.editeur ?? ""}`.toLowerCase().includes(filtre));
    const tri = state.triMine ?? "alpha";
    groupes.sort((a, b) => tri === "prog" ? (b.vs.length / b.total) - (a.vs.length / a.total)
      : tri === "nb" ? b.vs.length - a.vs.length : (a.se.titre ?? "").localeCompare(b.se.titre ?? "", lang));
    const tousOuverts = groupes.length && groupes.every(g => state.ouverts.has(g.sid));
    app.innerHTML = haut + `<div class="mine-bar">
        <input type="search" id="filtreMine" placeholder="${esc(t("filterPh"))}" value="${esc(state.filtreMine ?? "")}">
        <select id="triMine" aria-label="${esc(t("sortL"))}">
          <option value="alpha" ${tri === "alpha" ? "selected" : ""}>A → Z</option>
          <option value="prog" ${tri === "prog" ? "selected" : ""}>${t("sortProg")}</option>
          <option value="nb" ${tri === "nb" ? "selected" : ""}>${t("sortNb")}</option></select>
        <button class="btn ghost" id="toutDeplier">${tousOuverts ? t("collapseAll") : t("expandAll")}</button></div>
      <div class="mine-list">${groupes.map(g => {
        const ouvert = state.ouverts.has(g.sid);
        const v0 = g.vs[0], img = v0.photo_url || v0.couverture_url || (v0.isbn13 ? `https://covers.openlibrary.org/b/isbn/${v0.isbn13}-S.jpg?default=false` : "");
        const pct = Math.min(100, Math.round(g.vs.length / Math.max(g.total, 1) * 100));
        return `<div class="mine-item ${ouvert ? "open" : ""}">
          <button class="mine-head" data-toggle="${g.sid}" aria-expanded="${ouvert}">
            <span class="mine-cover">${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>
            <span class="mine-info"><b>${esc(g.se.titre ?? "")}</b>
              <span class="meta">${esc([g.se.edition, g.se.editeur, (g.se.langue || "fr").toUpperCase()].filter(Boolean).join(" · "))}</span>
              ${kind === "collection" ? `<span class="mine-prog"><i style="width:${pct}%"></i></span>
                <span class="meta" style="font-size:12px">${t("readOf", g.vs.filter(v => state.coll.get(v.id)?.lu).length, g.vs.length)}</span>` : ""}</span>
            <span class="mine-count">${kind === "collection" ? `${g.vs.length}<small> / ${g.total}</small>` : g.vs.length}</span>
            <span class="mine-chev">${ouvert ? "▴" : "▾"}</span></button>
          ${ouvert ? `<div class="row" data-row="m-${g.sid}">${g.vs.map(v => tile(v, g.se)).join("")}</div>
            <button class="link mine-go" data-goto="${g.sid}">${t("seeSerie")} ›</button>` : ""}</div>`;
      }).join("")}</div>`;
    const sauver = () => store.set("isekaz.ouverts", [...state.ouverts]);
    app.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => {
      const sid = +b.dataset.toggle;
      state.ouverts.has(sid) ? state.ouverts.delete(sid) : state.ouverts.add(sid); sauver();
      dessinerMine(kind, haut, vols, false);
    });
    $("toutDeplier").onclick = () => { groupes.forEach(g => tousOuverts ? state.ouverts.delete(g.sid) : state.ouverts.add(g.sid)); sauver(); dessinerMine(kind, haut, vols, false); };
    $("triMine").onchange = e => { state.triMine = e.target.value; dessinerMine(kind, haut, vols, false); };
    $("filtreMine").oninput = e => { state.filtreMine = e.target.value; const pos = e.target.selectionStart;
      dessinerMine(kind, haut, vols, false); const f = $("filtreMine"); f.focus(); f.setSelectionRange(pos, pos); };
    app.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => {
      const se = state.series.find(x => x.id === +b.dataset.goto); se ? openOeuvre(cleOeuvre(se)) : openSerie(+b.dataset.goto); });
    bindTiles(vols); bindOnglets();
    app.querySelectorAll(".row[data-row]").forEach(r => { if (positions[r.dataset.row]) r.scrollLeft = positions[r.dataset.row]; });
    if (!first) window.scrollTo({ top: hauteur });
  }

  // ---------- Page œuvre : toutes les éditions en rangées ----------
  function tile(v, s, large = false) {
    const e = state.coll.get(v.id) ?? { quantite: 0, souhait: false };
    const img = v.photo_url || v.couverture_url || (v.isbn13 ? `https://covers.openlibrary.org/b/isbn/${v.isbn13}-M.jpg?default=false` : "");
    const produit = s.type && !["manga", "light_novel"].includes(s.type);
    const nom = large || produit ? (v.titre || v.variante_nom || s.titre) : `${t("tome")} ${v.numero}`;
    const sous = large ? (v.variante_nom && v.variante_nom !== nom ? v.variante_nom : v.contenu) : (v.variante && v.variante_nom ? v.variante_nom : "");
    return `<div class="tile ${large ? "wide" : ""} ${e.quantite > 0 ? "owned" : e.souhait ? "wished" : ""}" data-vid="${v.id}" role="button" tabindex="0">
      <div class="tile-cover">${large ? "" : v.numero}${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
        ${e.quantite > 1 ? `<span class="dblb">×${e.quantite}</span>` : ""}${!e.quantite && e.souhait ? `<span class="heart">♥</span>` : ""}
        ${e.lu ? `<span class="lub" title="${esc(t("readDone"))}">📖</span>` : ""}</div>
      <button class="tick" data-tick aria-label="${esc(e.quantite > 0 ? t("own") : t("own"))}">${e.quantite > 0 ? "✓" : "+"}</button>
      <div class="tile-name">${esc(nom)}</div>${sous ? `<div class="tile-sub">${esc(sous)}</div>` : ""}</div>`;
  }

  function bindTiles(vols) {
    const parId = new Map((vols ?? []).map(v => [v.id, v]));
    app.querySelectorAll(".tile[data-vid]").forEach(el => {
      const v = parId.get(+el.dataset.vid);
      if (!v) return;
      el.onclick = ev => {
        if (ev.target.closest("[data-tick]")) {
          const e = state.coll.get(v.id);
          return e?.quantite > 0 ? ouvrirTome(v) : setEntry(v.id, { quantite: 1 });
        }
        ouvrirTome(v);
      };
      el.onkeydown = ev => { if (ev.key === "Enter") ouvrirTome(v); };
    });
  }

  function ouvrirTome(v) {
    const s = state.series.find(x => x.id === v.serie_id) ?? {};
    if (!$("fiche").open) $("fiche").showModal();
    renderFiche({ ...v, series: s });
    if (!isOffline() && v.isbn13 && estLivre(v.isbn13) && !v.fiche_maj)
      chercherFiche(v.isbn13).then(full => { if (full && $("fiche").open) renderFiche(full); });
  }

  async function openOeuvre(key) {
    const first = state.view !== "oeuvre" || state.oeuvre !== key;
    state.view = "oeuvre"; state.oeuvre = key; state.filterIds = null;
    const toutes = state.series.filter(x => cleOeuvre(x) === key);
    if (!toutes.length) { state.view = "catalogue"; return render(); }
    const ordre = e => (state.editionLangs.has(e.langue || "fr") ? 0 : 1) * 1e6 - (e.volumes[0]?.count ?? 0);
    toutes.sort((a, b) => ordre(a) - ordre(b) || (a.edition ? 1 : 0) - (b.edition ? 1 : 0));
    const ids = toutes.map(x => x.id);
    const cache = await volsDe(ids);
    if (cache.complet) dessinerOeuvre(toutes, cache.vols, first);
    else if (first) { chargement(); window.scrollTo({ top: 0 }); setNav(); }
    if (cache.complet && cache.frais) return; // déjà à jour
    const { data, error } = await avecDelai(db.from("volumes").select("*").in("serie_id", ids).order("numero"));
    if (state.view !== "oeuvre" || state.oeuvre !== key) return; // on a changé de page entre-temps
    if (error) { if (!cache.complet) dessinerOeuvre(toutes, cache.vols, first); return; }
    const par = {}; data.forEach(v => (par[v.serie_id] ??= []).push(v));
    ids.forEach(id => rememberVols(id, par[id] ?? []));
    if (!cache.complet || signature(cache.vols) !== signature(data)) dessinerOeuvre(toutes, data, first && !cache.complet);
  }

  // Genres manquants : on les demande une fois (AniList), puis toutes les éditions de l'œuvre en profitent
  state.genresDemandes ??= new Set();
  async function enrichirGenres(toutes, vols) {
    const key = cleOeuvre(toutes[0]);
    if (isOffline() || toutes.some(e => e.genres_maj) || state.genresDemandes.has(key)) return;
    state.genresDemandes.add(key);
    try {
      const r = await fetch(`${URL_SB}/functions/v1/genres`, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ titre: toutes[0].titre }) });
      const res = await r.json();
      if (!res.genres) return;
      for (const e of toutes) { e.genres = res.genres; e.genres_maj = new Date().toISOString(); if (!e.public && res.public) e.public = res.public; }
      local.set("series", state.series);
      if (state.view === "oeuvre" && state.oeuvre === key) dessinerOeuvre(toutes, vols, false);
    } catch { /* pas grave : on réessaiera à la prochaine visite */ }
  }

  function dessinerOeuvre(toutes, vols, first) {
    setTimeout(() => enrichirGenres(toutes, vols), 0);
    const s0 = toutes[0];
    const titre = toutes.map(e => e.titre).sort((a, b) => [...b].filter(c => c !== c.toLowerCase()).length - [...a].filter(c => c !== c.toLowerCase()).length)[0];
    const pubs = [...new Set(toutes.map(e => e.public).filter(Boolean))];
    const genres = [...new Set(toutes.flatMap(e => e.genres ?? []))].sort();
    const auteurs = [...new Set(toutes.map(e => e.auteur).filter(Boolean))];
    const types = [...new Set(toutes.map(e => e.type || "manga"))];
    const coffrets = [];

    const blocEdition = (s) => {
      const vs = (vols ?? []).filter(v => v.serie_id === s.id).sort((a, b) => a.numero - b.numero);
      const normaux = vs.filter(v => !v.variante);
      coffrets.push(...vs.filter(v => ["coffret", "starter", "bundle"].includes(v.variante)).map(v => [v, s]));
      const nomEd = s.edition || t("simple");
      const statut = s.statut === "terminée" ? t("finie") : s.statut ? t("enCours") : "";
      let html = "";
      if (normaux.length || !vs.length) html += `<div class="ed"><button class="ed-head" data-serie="${s.id}">
          <div class="t">${esc(nomEd)} • ${esc(s.editeur ?? "—")}<span class="chev">›</span></div>
          <div class="s">${[t("nParus", normaux.length), statut, (s.langue || "fr").toUpperCase()].filter(Boolean).map(esc).join(" • ")}</div></button>
        ${normaux.length ? `<div class="row" data-row="${s.id}-n">${normaux.map(v => tile(v, s)).join("")}</div>` : ""}</div>`;
      // une rangée par type d'édition spéciale (collector, jaquettes, premier tirage…)
      for (const g of ["collector", "limitee", "premier_tirage", "jaquette_alt", "jaquette_coffret_dvd", "autre"]) {
        const sp = vs.filter(v => v.variante === g);
        if (!sp.length) continue;
        html += `<div class="ed"><button class="ed-head" data-serie="${s.id}">
            <div class="t">${esc(t("groupes")[g])} • ${esc(s.editeur ?? "—")}<span class="chev">›</span></div>
            <div class="s">${esc(t("nParus", sp.length))} • ${esc(t("linked", nomEd))}</div></button>
          <div class="row" data-row="${s.id}-${g}">${sp.map(v => tile(v, s)).join("")}</div></div>`;
      }
      return html;
    };
    const visibles = toutes.filter(e => state.editionLangs.has(e.langue || "fr"));
    const autres = toutes.filter(e => !state.editionLangs.has(e.langue || "fr"));
    const html1 = visibles.map(blocEdition).join("");
    const positions = first ? {} : Object.fromEntries([...app.querySelectorAll(".row[data-row]")].map(r => [r.dataset.row, r.scrollLeft]));
    const ouverts = first ? false : !!app.querySelector("details.autres[open]");
    const hauteur = window.scrollY;
    const html2 = autres.length ? `<details class="autres"><summary>${t("otherLangs", autres.length)}</summary>${autres.map(blocEdition).join("")}</details>` : "";

    app.innerHTML = `<button class="back">${t("back")}</button>
      <h2 class="oeuvre-title">${esc(titre)}</h2>
      <div class="oeuvre-type">${esc(types.map(x => t("types")[x] ?? x).join(" · "))}</div>
      ${pubs.length || genres.length ? `<div class="gchips">${pubs.map(p => `<span class="gchip pub">${esc(t("publics")[p])}</span>`).join("")}
        ${genres.map(g => `<span class="gchip">${esc(t("genresL")[g] ?? g)}</span>`).join("")}</div>` : ""}
      ${auteurs.length ? `<div class="block"><h3>${auteurs.length > 1 ? t("authors") : t("author")}</h3>
        ${auteurs.map(a => `<div class="person"><div><b>${esc(a)}</b><div class="meta">${t("author")}</div></div></div>`).join("")}</div>` : ""}
      <div class="block"><h3>${t("editions")}</h3>${html1}${html2}</div>
      ${coffrets.length ? `<div class="block"><h3>${t("boxes")}</h3><div class="row" data-row="coffrets">${coffrets.map(([v, s]) => tile(v, s, true)).join("")}</div></div>` : ""}
      <p style="margin-top:22px"><button class="btn ghost" id="addSpecialBtn">${t("addSpecial")}</button></p>`;

    app.querySelector(".back").onclick = () => { state.view = "catalogue"; render(); };
    app.querySelectorAll(".ed-head[data-serie]").forEach(b => b.onclick = () => openSerie(+b.dataset.serie));
    bindTiles(vols);
    if (!first) {
      app.querySelectorAll(".row[data-row]").forEach(r => { if (positions[r.dataset.row]) r.scrollLeft = positions[r.dataset.row]; });
      if (ouverts) app.querySelector("details.autres")?.setAttribute("open", "");
      window.scrollTo({ top: hauteur });
    }
    const max = Math.max(1, ...(vols ?? []).filter(v => v.serie_id === s0.id && !v.variante).map(v => v.numero));
    $("addSpecialBtn").onclick = () => openAjout({ mode: "variante", serie: s0, numero: 1, max });
    setNav();
    if (first) window.scrollTo({ top: 0 });
  }


  // ---------- Planning des sorties + alertes ----------
  const isoJour = d => d.toISOString().slice(0, 10);
  const lundi = d => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return isoJour(x); };
  const mesSeries = () => new Set([...state.coll.values()].filter(r => r.quantite > 0 || r.souhait).map(r => r.serie_id).filter(Boolean));
  // une sortie compte comme « mes séries » si l'œuvre est suivie (n'importe quelle édition de la même langue)
  function estMaSerie(v, suivies) {
    if (suivies.has(v.serie_id)) return true;
    const se = v.series ?? state.series.find(x => x.id === v.serie_id);
    if (!se) return false;
    const k = cleOeuvre(se);
    return state.series.some(x => suivies.has(x.id) && cleOeuvre(x) === k && (x.langue || "fr") === (se.langue || "fr") && x.editeur === se.editeur);
  }

  async function chargerPlanning() {
    const debut = new Date(); debut.setDate(debut.getDate() - 7);
    const fin = new Date(); fin.setDate(fin.getDate() + 150);
    if (state.planning && Date.now() - (state.planAt ?? 0) < 10 * 60e3) return state.planning;
    if (!isOffline()) {
      const { data, error } = await avecDelai(db.from("volumes")
        .select("id, serie_id, numero, titre, isbn13, date_parution, couverture_url, photo_url, prix, devise, variante, variante_nom, contenu, series(id, titre, edition, editeur, langue, type)")
        .gte("date_parution", isoJour(debut)).lte("date_parution", isoJour(fin)).order("date_parution").limit(1000));
      if (!error && data) { state.planning = data; state.planAt = Date.now(); local.set("planning", data); return data; }
    }
    return state.planning ??= (await local.get("planning")) ?? [];
  }

  async function renderPlanning() {
    if (!state.planning) chargement();
    const tous = await chargerPlanning();
    if (state.view !== "planning") return;
    state.planMode ??= state.user ? "mine" : "all";
    const suivies = mesSeries();
    const auj = isoJour(new Date());
    let list = tous.filter(v => v.date_parution && state.editionLangs.has(v.series?.langue || "fr"))
      .sort((a, b) => a.date_parution.localeCompare(b.date_parution) || (a.series?.titre ?? "").localeCompare(b.series?.titre ?? ""));
    if (state.planMode === "mine") list = list.filter(v => estMaSerie(v, suivies));
    const semaines = new Map();
    list.forEach(v => { const k = lundi(v.date_parution); (semaines.get(k) ?? semaines.set(k, []).get(k)).push(v); });
    const cetteSemaine = lundi(auj);
    const perm = "Notification" in window ? Notification.permission : "denied";
    app.innerHTML = `<h3 class="section-title">${TORII}${t("planTitle")}</h3>
      <div class="plan-bar"><div class="tabs-mine" style="margin:0;flex:1 1 100%">
        ${state.user ? `<button data-plan="mine" class="${state.planMode === "mine" ? "on" : ""}">${t("planMine")}</button>` : ""}
        <button data-plan="all" class="${state.planMode === "all" ? "on" : ""}">${t("planAll")}</button></div>
        ${list.some(v => v.date_parution >= auj) ? `<button class="btn ghost" id="icsBtn">${t("planIcs")}</button>` : ""}
        ${state.user && "Notification" in window ? `<button class="btn ghost" id="notifBtn" ${perm === "granted" ? "disabled" : ""}>${perm === "granted" ? t("alertsOk") : t("alertsOn")}</button>` : ""}</div>
      ${list.length ? [...semaines.entries()].map(([wk, vs]) => `<div class="plan-week">${wk === cetteSemaine ? t("thisWeek") : t("weekOf", fmtDate(wk))}</div>
        ${vs.map(v => {
          const se = v.series ?? {}, n = joursAvant(v.date_parution), e = state.coll.get(v.id) ?? {};
          const img = v.photo_url || v.couverture_url || (v.isbn13 ? `https://covers.openlibrary.org/b/isbn/${v.isbn13}-S.jpg?default=false` : "");
          return `<div class="plan-item ${estMaSerie(v, suivies) ? "mine" : ""}" data-pv="${v.id}">
            <div class="pc">${v.numero}${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>
            <div><b>${esc(se.titre ?? "")} — ${v.variante ? esc(v.variante_nom || t("variantes")[v.variante] || "") : `${t("tome")} ${v.numero}`}</b>
              <span class="meta">${esc([se.edition, se.editeur, fmtDate(v.date_parution), v.prix ? fmtPrix(v.prix, v.devise) : null].filter(Boolean).join(" · "))}</span></div>
            <div class="cd ${n < 0 ? "out" : ""}">${n < 0 ? t("out") : t("jMoins", n)}
              ${e.quantite > 0 ? `<small>✓</small>` : state.user ? `<button data-pw="${v.id}" aria-label="${esc(t("wishT"))}">${e.souhait ? "♥" : "♡"}</button>` : ""}</div></div>`;
        }).join("")}`).join("")
        : `<p class="empty">${state.planMode === "mine" ? t("planEmptyMine") : t("planEmpty")}</p>`}
      <p class="meta" style="font-size:12px;margin-top:18px">${t("planNote")}</p>`;
    const parId = new Map(list.map(v => [v.id, v]));
    app.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => { state.planMode = b.dataset.plan; renderPlanning(); });
    app.querySelectorAll("[data-pv]").forEach(el => el.onclick = ev => {
      const v = parId.get(+el.dataset.pv);
      if (ev.target.closest("[data-pw]")) { const e = state.coll.get(v.id) ?? {}; setEntry(v.id, { souhait: !e.souhait }); return; }
      ouvrirTome(v);
    });
    const ics = $("icsBtn");
    if (ics) ics.onclick = () => telechargerIcs(list.filter(v => v.date_parution >= auj));
    const nb = $("notifBtn");
    if (nb) nb.onclick = async () => { const r = await Notification.requestPermission(); if (r !== "granted") say(t("alertsNo")); renderPlanning(); verifierAlertes(); };
    setNav();
  }

  function telechargerIcs(vols) {
    const j = d => d.replaceAll("-", "");
    const lendemain = d => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() + 1); return j(isoJour(x)); };
    const echap = x => String(x ?? "").replace(/[\\,;]/g, m => "\\" + m).replace(/\n/g, " ");
    const lignes = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Isekaz Collection//FR", "CALSCALE:GREGORIAN"];
    const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
    for (const v of vols) lignes.push("BEGIN:VEVENT", `UID:isekaz-${v.id}@isekaz`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${j(v.date_parution)}`,
      `DTEND;VALUE=DATE:${lendemain(v.date_parution)}`, `SUMMARY:${echap(`${v.series?.titre ?? ""} — ${t("tome")} ${v.numero}`)}`,
      `DESCRIPTION:${echap([v.series?.editeur, v.isbn13].filter(Boolean).join(" · "))}`, "END:VEVENT");
    lignes.push("END:VCALENDAR");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lignes.join("\r\n")], { type: "text/calendar" }));

  // ---------- Lens : reconnaître une couverture en photo ----------
  const TESS = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
  const normL = x => String(x ?? "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  function chargerTesseract() {
    return window.Tesseract ? Promise.resolve(window.Tesseract) : new Promise((ok, ko) => {

  function rapprocher(texte) {

      const tt = normL(o.eds[0].titre), tm = tt.split(" ").filter(m => m.length >= 2);

      const score = plat.includes(" " + tt + " ") ? 1 + tt.length / 100 : tm.filter(m => mots.has(m)).length / tm.length;
      return score >= .6 && (tm.length > 1 || tt.length >= 4) ? { o, score } : null;
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 6);

  // ---------- Pétales de cerisier ----------
  (function sakura() {
    const cv = $("sakura"), ctx = cv.getContext("2d");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let w, h, petals = [], raf;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    function resize() {
      w = innerWidth; h = innerHeight;
      cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = reduce ? 0 : Math.round(Math.min(34, Math.max(12, w / 40)));
      while (petals.length < n) petals.push(newPetal(true));
      petals.length = n;
    }
    function newPetal(anywhere) {
      return { x: Math.random() * w, y: anywhere ? Math.random() * h : -20, s: 5 + Math.random() * 7,
               vy: .35 + Math.random() * .8, vx: .2 + Math.random() * .6, a: Math.random() * Math.PI * 2,
               va: (Math.random() - .5) * .03, sway: Math.random() * Math.PI * 2, o: .45 + Math.random() * .45,
               hue: Math.random() < .2 ? "#ffffff" : Math.random() < .5 ? "#f6a9bd" : "#f2869f" };
    }
    function draw(p) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.scale(1, .55 + .45 * Math.abs(Math.sin(p.sway)));
      ctx.globalAlpha = p.o; ctx.fillStyle = p.hue;
      ctx.beginPath(); ctx.moveTo(0, -p.s);
      ctx.bezierCurveTo(p.s * .9, -p.s * .6, p.s * .7, p.s * .6, 0, p.s);
      ctx.bezierCurveTo(-p.s * .7, p.s * .6, -p.s * .9, -p.s * .6, 0, -p.s);
      ctx.fill();
      ctx.globalAlpha = p.o * .5; ctx.fillStyle = "#e0283c";
      ctx.beginPath(); ctx.arc(0, -p.s * .78, p.s * .14, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    function tick() {
      ctx.clearRect(0, 0, w, h);
      for (const p of petals) {
        p.sway += .02; p.y += p.vy; p.x += p.vx + Math.sin(p.sway) * .6; p.a += p.va;
        if (p.y > h + 20 || p.x > w + 20) Object.assign(p, newPetal(false), { x: Math.random() * w * 1.1 - w * .1 });
        draw(p);
      }
      raf = requestAnimationFrame(tick);
    }
    addEventListener("resize", resize);
    document.addEventListener("visibilitychange", () => { cancelAnimationFrame(raf); if (!document.hidden && petals.length) tick(); });
    resize(); if (petals.length) tick();
  })();

  // ---------- Scanner de code-barres ----------
  // EAN-13 d'un livre : commence par 978 ou 979, avec la bonne clé de contrôle.
  function isbnValide(code) {
    const d = String(code).replace(/[^0-9]/g, "");
    if (!/^97[89]\d{10}$/.test(d)) return null;
    const sum = [...d.slice(0, 12)].reduce((a, c, i) => a + +c * (i % 2 ? 3 : 1), 0);
    return (10 - sum % 10) % 10 === +d[12] ? d : null;
  }
  // Tout code-barres de produit : EAN-13, UPC-A (12 chiffres, figurines US…) ou EAN-8, clé de contrôle vérifiée
  function eanValide(code) {
    let d = String(code).replace(/[^0-9]/g, "");
    if (d.length === 12) d = "0" + d;
    if (d.length !== 13 && d.length !== 8) return null;
    const corps = d.slice(0, -1), w = d.length === 13 ? [1, 3] : [3, 1];
    const sum = [...corps].reduce((a, c, i) => a + +c * w[i % 2], 0);
    return (10 - sum % 10) % 10 === +d.at(-1) ? d : null;
  }
  const estLivre = c => /^97[89]\d{10}$/.test(c);
  const ZXING = "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";
  const scan = { stream: null, timer: null, controls: null, busy: false };

  async function openScanner() {
    $("scanStatus").textContent = t("aim"); $("manualIsbn").value = "";
    $("scanner").showModal();
    scan.busy = false;
    try {
      const video = $("video");
      const formats = "BarcodeDetector" in window ? (await BarcodeDetector.getSupportedFormats()).filter(f => ["ean_13", "upc_a", "ean_8"].includes(f)) : [];
      if (formats.includes("ean_13")) {
        scan.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } }, audio: false });
        video.srcObject = scan.stream; await video.play();
        const det = new BarcodeDetector({ formats });
        const loop = async () => {
          if (!scan.stream) return;
          try { for (const c of await det.detect(video)) if (await found(c.rawValue)) return; } catch { /* image pas prête */ }
          scan.timer = setTimeout(loop, 180);
        };
        loop();
      } else {
        // iPhone et navigateurs sans détecteur intégré : bibliothèque ZXing (gardée pour le hors ligne)
        const { BrowserMultiFormatReader } = await import(ZXING);
        const reader = new BrowserMultiFormatReader();
        scan.controls = await reader.decodeFromConstraints({ video: { facingMode: "environment" } }, video, r => { if (r) found(r.getText()); });
      }
    } catch (e) { $("scanStatus").textContent = t("noCam"); }
  }

  function stopScanner() {
    clearTimeout(scan.timer);
    scan.stream?.getTracks().forEach(tr => tr.stop()); scan.stream = null;
    try { scan.controls?.stop(); } catch { /* déjà arrêté */ } scan.controls = null;
    $("video").srcObject = null;
  }

  async function found(raw) {
    if (scan.busy) return true;
    const isbn = eanValide(raw);
    if (!isbn) { $("scanStatus").textContent = t("badIsbn"); return false; }
    scan.busy = true;
    navigator.vibrate?.(60);
    stopScanner(); $("scanner").close();
    openFiche(isbn);
    return true;
  }

  // ---------- Fiche produit ----------
  const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString(lang === "fr" ? "fr-FR" : "en-GB", { day: "numeric", month: "long", year: "numeric" });
  const joursAvant = d => Math.round((new Date(d + "T00:00:00") - new Date(new Date().toDateString())) / 86400000);
  const fmtPrix = (p, dev) => { try { return new Intl.NumberFormat(lang === "fr" ? "fr-FR" : "en-GB", { style: "currency", currency: dev || "EUR" }).format(p); } catch { return `${p} ${dev ?? ""}`; } };

  async function chercherFiche(isbn) {
    if (!estLivre(isbn)) return chercherProduit(isbn);
    // 1. copie locale (marche hors ligne)
    const sid = ((await local.get("isbnIndex")) ?? {})[isbn];
    let v = null;
    if (sid) {
      const vols = (await local.get(`vols:${sid}`)) ?? [];
      const vl = vols.find(x => x.isbn13 === isbn);
      const s = state.series.find(x => x.id === +sid);
      if (vl && s) v = { ...vl, series: s };
    }
    if (isOffline()) return v;
    // 2. en ligne : fiche complète (description, prix, date…), créée si le tome n'existe pas encore
    if (v && v.fiche_maj) return v;
    try {
      const r = await fetch(`${URL_SB}/functions/v1/recherche`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fiche: isbn }) });
      const res = await r.json();
      if (res.volume) {
        const { series: s, ...vol } = res.volume;
        const cached = (await local.get(`vols:${vol.serie_id}`)) ?? [];
        await rememberVols(vol.serie_id, [...cached.filter(x => x.id !== vol.id), vol].sort((a, b) => a.numero - b.numero));
        if (!state.series.some(x => x.id === s.id)) await loadSeries();
        return res.volume;
      }
    } catch { /* réseau perdu en route */ }
    return v;
  }

  async function chercherProduit(code) {
    const sid = ((await local.get("isbnIndex")) ?? {})[code];
    if (sid) {
      const vl = ((await local.get(`vols:${sid}`)) ?? []).find(x => x.isbn13 === code);
      const s = state.series.find(x => x.id === +sid);
      if (vl && s && (isOffline() || vl.titre)) return { ...vl, series: s };
    }
    if (isOffline()) return null;
    const { data } = await db.from("volumes").select("*, series(*)").eq("isbn13", code).maybeSingle();
    return data;
  }

  function renderInconnu(code) {
    $("ficheBody").innerHTML = `<p class="tip">${esc(t("unknownProduct", code))}<br>${t("unknownHint")}</p>
      <div class="prod-actions"><button class="btn" id="addUnknown">${t("addProduct")}</button></div>`;
    $("addUnknown").onclick = () => { $("fiche").close(); openAjout({ mode: "produit", ean: code, type: estLivre(code) ? "manga" : "figurine" }); };
  }

  async function openFiche(isbn) {
    const body = $("ficheBody");
    body.innerHTML = `<p class="scan-status">${t("loadingFiche")}</p>`;
    if (!$("fiche").open) $("fiche").showModal();
    const v = await chercherFiche(isbn);
    if (!v && isOffline()) return renderScanEnAttente(isbn);
    if (!v) return renderInconnu(isbn);
    renderFiche(v);
  }

  function renderFiche(v) {
    const s = v.series ?? {};
    const e = state.coll.get(v.id) ?? { quantite: 0, souhait: false };
    const img = v.photo_url || v.couverture_url || (v.isbn13 ? `https://covers.openlibrary.org/b/isbn/${v.isbn13}-M.jpg?default=false` : "");
    let date = "—";
    if (v.date_parution) {
      const n = joursAvant(v.date_parution);
      date = esc(fmtDate(v.date_parution)) + (n >= 0 ? ` <span class="soon">${t("soonOut")} · ${t("inDays", n)}</span>` : "");
    }
    const produit = s.type && s.type !== "manga" && s.type !== "light_novel";
    const nom = (produit && v.titre) ? v.titre : `${v.titre && !v.variante ? v.titre : `${s.titre ?? ""}${s.edition ? " - " + s.edition : ""} - ${t("volL")} ${v.numero}`}`
      + (v.variante ? ` — ${t("variantes")[v.variante] ?? v.variante}` : "");
    const actions = e.quantite > 0
      ? `<div class="qty"><button data-a="minus" aria-label="${esc(t("removeOne"))}">−</button><span>×${e.quantite}${e.quantite > 1 ? ` · ${t("doubles", e.quantite - 1)}` : ""}</span><button data-a="plus" aria-label="${esc(t("addOne"))}">+</button></div>`
      : `<button class="btn" data-a="own">${t("own")}</button><button class="btn ghost" data-a="wish">${e.souhait ? "♥" : "♡"} ${t("wishT")}</button>`;
    $("ficheBody").innerHTML = `<div class="prod">
        <div class="cover">${v.numero}<img src="${esc(img)}" alt="" style="position:absolute;inset:0" onerror="this.remove()"></div>
        <div><h4>${esc(nom)}</h4><div class="meta">${esc([s.titre, s.edition].filter(Boolean).join(" · "))}</div>
          <dl><dt>${t("publisher")}</dt><dd>${esc(s.editeur ?? "—")}</dd>
              <dt>${estLivre(v.isbn13 ?? "") ? t("isbnL") : t("eanL")}</dt><dd class="isbn" style="font-size:13px">${esc(v.isbn13 ?? "—")}</dd>
              <dt>${t("release")}</dt><dd>${date}</dd>
              <dt>${t("price")}</dt><dd>${v.prix != null ? esc(fmtPrix(v.prix, v.devise)) : `<span class="meta">${t("priceUnknown")}</span>`}</dd>
              <dt>${t("langL")}</dt><dd>${esc(t("langs")[s.langue] ?? s.langue ?? "—")}</dd>
              ${s.type && s.type !== "manga" ? `<dt>${t("fType")}</dt><dd>${esc(t("types")[s.type] ?? s.type)}</dd>` : ""}
              ${v.variante_nom ? `<dt>${t("fName")}</dt><dd>${esc(v.variante_nom)}</dd>` : ""}
              ${v.contenu ? `<dt>${t("fContent").replace(/ \(.*\)/, "")}</dt><dd>${esc(v.contenu)}</dd>` : ""}</dl>
          ${v.ajoute_par ? `<div class="meta" style="font-size:12px;margin-top:6px">${t("addedBy")}</div>` : ""}</div></div>
      ${v.description ? `<p class="desc short" id="desc">${esc(v.description)}</p><button class="link" id="descMore">${t("more")}</button>
        ${s.langue && s.langue !== lang ? `<p class="meta" style="font-size:12px">${t("descOther")}</p>` : ""}` : ""}
      <div class="prod-actions">${actions}</div>
      <div class="prod-actions"><button class="btn ghost lu-btn ${e.lu ? "on" : ""}" data-a="lu" aria-pressed="${!!e.lu}">${e.lu ? t("readDone") : t("readMark")}</button>
        <button class="btn ghost" id="seeSerie">${t("seeSerie")}</button></div>`;
    const more = $("descMore");
    if (more) more.onclick = () => { const d = $("desc"); d.classList.toggle("short"); more.textContent = d.classList.contains("short") ? t("more") : t("less"); };
    $("seeSerie").onclick = () => { $("fiche").close(); const se = state.series.find(x => x.id === v.serie_id) ?? s;
      se?.titre ? openOeuvre(cleOeuvre(se)) : openSerie(v.serie_id); };
    $("ficheBody").querySelectorAll("button[data-a]").forEach(b => b.onclick = async () => {
      const cur = state.coll.get(v.id) ?? { quantite: 0, souhait: false };
      const patch = { own: { quantite: 1 }, plus: { quantite: cur.quantite + 1 }, minus: { quantite: cur.quantite - 1 }, wish: { souhait: !cur.souhait },
        lu: { lu: !cur.lu } }[b.dataset.a];
      await setEntry(v.id, patch);
      if (state.user) renderFiche(v);
    });
  }

  // ---------- Scans faits sans réseau ----------
  function renderScanEnAttente(isbn) {
    $("ficheBody").innerHTML = `<p class="tip">${esc(t("offlineScan", isbn))}</p><p class="meta" style="margin-top:14px">${t("offlineScanAs")}</p>
      <div class="prod-actions"><button class="btn" data-k="own">${t("keepOwn")}</button><button class="btn ghost" data-k="wish">${t("keepWish")}</button>
      <button class="btn ghost" data-k="look">${t("keepLook")}</button></div>`;
    $("ficheBody").querySelectorAll("button[data-k]").forEach(b => b.onclick = async () => {
      const scans = ((await local.get("scans")) ?? []).filter(x => x.isbn !== isbn);
      scans.push({ isbn, action: b.dataset.k, at: new Date().toISOString() });
      await local.set("scans", scans);
      $("fiche").close(); updateOffline(); if (state.view === "collection") render();
    });
  }

  async function resolveScans() {
    if (isOffline()) return;
    let scans = (await local.get("scans")) ?? [];
    if (!scans.length) return;
    let ok = 0, ko = 0;
    for (const sc of [...scans]) {
      let v = null;
      try {
        if (estLivre(sc.isbn)) {
          const r = await fetch(`${URL_SB}/functions/v1/recherche`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fiche: sc.isbn }) });
          v = (await r.json()).volume;
        } else {
          const { data, error } = await db.from("volumes").select("id").eq("isbn13", sc.isbn).maybeSingle();
          if (error) throw error;
          v = data;
        }
      } catch { break; } // réseau reperdu : on garde le reste pour plus tard
      if (v && state.user && sc.action !== "look") await setEntry(v.id, sc.action === "own" ? { quantite: Math.max(1, state.coll.get(v.id)?.quantite ?? 0) } : { souhait: true });
      v ? ok++ : ko++;
      scans = scans.filter(x => x.isbn !== sc.isbn);
      await local.set("scans", scans);
    }
    await loadSeries();
    say([ok ? t("scansDone", ok) : "", ko ? t("scansFailed", ko) : ""].filter(Boolean).join(" "));
    updateOffline(); render();
  }

  // ---------- Ajout par les membres : édition spéciale ou nouveau produit ----------
  async function compresser(file) {
    try {
      const img = await createImageBitmap(file);
      const k = Math.min(1, 1200 / Math.max(img.width, img.height));
      const c = Object.assign(document.createElement("canvas"), { width: Math.round(img.width * k), height: Math.round(img.height * k) });
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.82));
    } catch { return file; }
  }

  function openAjout(o) {
    if (!state.user) { openAuth("login"); say(t("fNeedLogin")); return; }
    if (isOffline()) { say(t("fNeedNet")); return; }
    const produit = o.mode === "produit";
    const opts = (obj, sel) => Object.entries(obj).map(([k, v]) => `<option value="${k}" ${k === sel ? "selected" : ""}>${esc(v)}</option>`).join("");
    $("ajoutTitre").textContent = produit ? t("addProduct") : t("addSpecial").replace(/^＋\s*/, "");
    $("ajoutForm").innerHTML = (produit ? `
        <label>${t("fType")}<select name="type">${opts(t("types"), o.type)}</select></label>
        <label>${t("fName")}<input name="nom" required maxlength="120" placeholder="${esc(t("fProdPh"))}"></label>
        <label>${t("fFranchise")}<input name="franchise" maxlength="120"></label>
        <label>${t("fBrand")}<input name="marque" maxlength="80"></label>` : `
        <div class="row2"><label>${t("fVol")}<input name="numero" type="number" min="1" max="300" value="${o.numero}" required></label>
          <label>${t("fKind")}<select name="variante">${opts(t("variantes"), "jaquette_alt")}</select></label></div>
        <label>${t("fName")}<input name="nom" required maxlength="120" placeholder="${esc(t("fNamePh"))}"></label>
        <label>${t("fContent")}<input name="contenu" maxlength="200" placeholder="${esc(t("fContentPh"))}"></label>`) + `
      <label>${t("fEan")}<input name="ean" inputmode="numeric" maxlength="17" value="${esc(o.ean ?? "")}"></label>
      <label>${t("fPhoto")}<input name="photo" type="file" accept="image/*" capture="environment"></label>
      <img class="photo-prev" id="photoPrev" alt="">
      <p class="err" id="ajoutErr"></p>
      <button class="btn" type="submit" id="ajoutOk">${t("fSave")}</button>`;
    const f = $("ajoutForm");
    f.photo.onchange = () => { const file = f.photo.files[0]; const pv = $("photoPrev");
      if (file) { pv.src = URL.createObjectURL(file); pv.style.display = "block"; } else pv.style.display = "none"; };
    f.onsubmit = async e => {
      e.preventDefault();
      const err = $("ajoutErr"), ok = $("ajoutOk");
      err.textContent = "";
      const nom = f.nom.value.trim();
      if (!nom) { err.textContent = t("fNeedName"); return; }
      let ean = null;
      if (f.ean.value.trim()) {
        ean = eanValide(f.ean.value);
        if (!ean) { err.textContent = t("badIsbn"); return; }
        const { data: deja } = await db.from("volumes").select("id").eq("isbn13", ean).maybeSingle();
        if (deja) { err.textContent = t("fEanTaken"); return; }
      }
      ok.disabled = true; ok.textContent = t("fSaving");
      try {
        let photo_url = null;
        const file = f.photo.files[0];
        if (file) {
          const blob = await compresser(file);
          const chemin = `${state.user.id}/${Date.now()}.jpg`;
          const { error } = await db.storage.from("photos").upload(chemin, blob, { contentType: "image/jpeg" });
          if (error) throw error;
          photo_url = db.storage.from("photos").getPublicUrl(chemin).data.publicUrl;
        }
        let sid, row;
        if (produit) {
          const type = f.type.value, titre = f.franchise.value.trim() || nom, marque = f.marque.value.trim() || null;
          const ex = state.series.find(x => x.titre.toLowerCase() === titre.toLowerCase() && (x.type || "manga") === type
            && (x.editeur ?? "").toLowerCase() === (marque ?? "").toLowerCase() && !x.edition);
          if (ex) sid = ex.id;
          else {
            const { data, error } = await db.from("series").insert({ titre, type, editeur: marque, langue: lang, source: "membre",
              ajoute_par: state.user.id }).select("id").single();
            if (error) throw error;
            sid = data.id;
          }
          const { data: der } = await db.from("volumes").select("numero").eq("serie_id", sid).is("variante", null).order("numero", { ascending: false }).limit(1);
          row = { serie_id: sid, numero: (der?.[0]?.numero ?? 0) + 1, titre: nom };
        } else {
          sid = o.serie.id;
          row = { serie_id: sid, numero: +f.numero.value, variante: f.variante.value, variante_nom: nom, contenu: f.contenu.value.trim() || null };
        }
        const { error } = await db.from("volumes").insert({ ...row, isbn13: ean, photo_url, ajoute_par: state.user.id });
        if (error) throw error;
        const { data: vols } = await db.from("volumes").select("*").eq("serie_id", sid).order("numero");
        if (vols) await rememberVols(sid, vols);
        await loadSeries();
        $("ajout").close(); say(t("fDone"));
        if (produit && ean) openFiche(ean); else openSerie(sid);
      } catch (x) {
        err.textContent = t("error") + (x.message ?? x);
      } finally { ok.disabled = false; ok.textContent = t("fSave"); }
    };
    $("ajout").showModal();
  }
  $("ajoutClose").onclick = () => $("ajout").close();

  $("scanBtn").onclick = openScanner;
  $("scanClose").onclick = () => { stopScanner(); $("scanner").close(); };
  $("scanner").addEventListener("close", stopScanner);
  $("ficheClose").onclick = () => $("fiche").close();
  $("manualForm").addEventListener("submit", e => { e.preventDefault(); found($("manualIsbn").value); });
  $("lensInput").onchange = e => { const f = e.target.files?.[0]; e.target.value = ""; if (f) lens(f); };

  // ---------- Application installable + hors ligne ----------
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
  let installEvt = null;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("installBtn").classList.add("show"); });
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone) $("installBtn").classList.add("show");
  $("installBtn").onclick = async () => {
    if (installEvt) { installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("installBtn").classList.remove("show"); }
    else say(t("iosInstall"));
  };
  addEventListener("online", async () => { await flushQueue(); await loadSeries(); await loadUser(); render(); await resolveScans(); await syncCatalogue(); prefetchForOffline(); verifierAlertes(); });
  addEventListener("offline", () => updateOffline());

  applyI18n();
  await loadSeries();
  await loadUser();
  const lien = location.hash.match(/^#u=(.+)$/);
  if (lien) { state.view = "u"; state.pseudoVu = decodeURIComponent(lien[1]); }
  render();
  verifierAlertes();
  flushQueue().then(resolveScans).then(syncCatalogue).then(prefetchForOffline);
  // sans détecteur intégré, on garde ZXing en réserve pour pouvoir scanner hors ligne
  if (!("BarcodeDetector" in window) && !isOffline()) setTimeout(() => import(ZXING).catch(() => {}), 4000);
</script>
</body>
</html>
